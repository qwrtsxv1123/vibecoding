    <title>vibecoding — Навигация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 8px;
            color: #58a6ff;
        }

        .subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 40px;
            font-size: 0.95rem;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-list a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #c9d1d9;
            text-decoration: none;
            font-size: 1.05rem;
            transition: all 0.2s ease;
        }

        .nav-list a:hover {
            background: #1c2333;
            border-color: #58a6ff;
            transform: translateX(6px);
            color: #ffffff;
        }

        .nav-list a .icon {
            font-size: 1.4rem;
            width: 32px;
            text-align: center;
        }

        .nav-list a .label {
            flex: 1;
        }

        .nav-list a .arrow {
            color: #484f58;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .nav-list a:hover .arrow {
            color: #58a6ff;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: #484f58;
            font-size: 0.85rem;
        }
    </style>
</head>
