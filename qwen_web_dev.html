<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Интерактивный курс Python</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg-900: #0a0a23;
    --bg-800: #1b1b32;
    --bg-700: #2a2a40;
    --bg-600: #3b3b4f;
    --text-100: #ffffff;
    --text-200: #dfdfe2;
    --text-300: #acacac;
    --text-400: #858591;
    --brand: #f1be32;
    --brand-hover: #f7d070;
    --brand-dark: #886418;
    --success: #acd157;
    --success-dark: #5a8a0f;
    --danger: #e71837;
    --info: #3b9ae0;
    --purple: #9b5de5;
    --border: #3b3b4f;
    --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  
  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-900);
    color: var(--text-200);
    overflow: hidden;
    font-size: 14px;
    line-height: 1.5;
  }
  
  /* ============ HEADER ============ */
  header {
    height: 56px;
    background: var(--bg-800);
    border-bottom: 3px solid var(--brand);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 20px;
    box-shadow: var(--shadow);
    z-index: 100;
    position: relative;
  }
  
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 20px;
    color: var(--brand);
    cursor: pointer;
  }
  
  .logo-icon {
    width: 34px;
    height: 34px;
    background: var(--brand);
    color: var(--bg-900);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 18px;
    font-family: 'JetBrains Mono', monospace;
  }
  
  .logo-text span { color: var(--text-200); }
  
  .header-stats {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-left: auto;
  }
  
  .stat-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--bg-700);
    border-radius: 20px;
    font-size: 13px;
    color: var(--text-200);
    border: 1px solid var(--border);
  }
  
  .stat-badge .icon { font-size: 14px; }
  .stat-badge .value { font-weight: 700; color: var(--brand); }
  
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .progress-bar {
    width: 220px;
    height: 10px;
    background: var(--bg-700);
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--brand), var(--brand-hover));
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 8px rgba(241, 190, 50, 0.4);
  }
  
  .progress-text {
    font-size: 13px;
    color: var(--text-300);
    font-weight: 600;
    min-width: 60px;
  }
  
  /* ============ MAIN LAYOUT ============ */
  .main {
    display: flex;
    height: calc(100vh - 56px);
  }
  
  /* ============ SIDEBAR ============ */
  .sidebar {
    width: 320px;
    background: var(--bg-800);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }
  
  .sidebar::-webkit-scrollbar { width: 8px; }
  .sidebar::-webkit-scrollbar-track { background: var(--bg-800); }
  .sidebar::-webkit-scrollbar-thumb { background: var(--bg-600); border-radius: 4px; }
  .sidebar::-webkit-scrollbar-thumb:hover { background: var(--text-400); }
  
  .sidebar-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-800);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  
  .sidebar-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-400);
    font-weight: 600;
  }
  
  .module {
    border-bottom: 1px solid var(--border);
  }
  
  .module-header {
    padding: 14px 20px;
    background: var(--bg-700);
    color: var(--brand);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  
  .module-header:hover {
    background: #35354d;
    border-left-color: var(--brand);
  }
  
  .module-header .arrow {
    font-size: 10px;
    transition: transform 0.2s;
    color: var(--text-400);
  }
  
  .module.collapsed .arrow { transform: rotate(-90deg); }
  .module.collapsed .lesson-list { display: none; }
  
  .lesson-item {
    padding: 11px 20px 11px 32px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.15s;
    color: var(--text-200);
    border-left: 3px solid transparent;
    position: relative;
  }
  
  .lesson-item:hover {
    background: var(--bg-700);
    border-left-color: var(--text-400);
  }
  
  .lesson-item.active {
    background: var(--bg-700);
    border-left-color: var(--brand);
    color: var(--brand);
    font-weight: 600;
  }
  
  .lesson-item.completed .check-icon { color: var(--success); }
  
  .check-icon {
    font-size: 14px;
    width: 16px;
    flex-shrink: 0;
    color: var(--text-400);
  }
  
  .lesson-title-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  
  /* ============ CONTENT ============ */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-900);
  }
  
  /* ============ LESSON DESCRIPTION ============ */
  .lesson-desc {
    padding: 28px 40px;
    overflow-y: auto;
    background: var(--bg-900);
    border-bottom: 1px solid var(--border);
    max-height: 42%;
    flex-shrink: 0;
  }
  
  .lesson-desc::-webkit-scrollbar { width: 10px; }
  .lesson-desc::-webkit-scrollbar-track { background: var(--bg-900); }
  .lesson-desc::-webkit-scrollbar-thumb { background: var(--bg-600); border-radius: 5px; }
  
  .lesson-desc h2 {
    color: var(--brand);
    font-size: 24px;
    margin-bottom: 16px;
    font-weight: 700;
    line-height: 1.3;
  }
  
  .lesson-desc p {
    margin-bottom: 12px;
    line-height: 1.7;
    font-size: 15px;
    color: var(--text-200);
  }
  
  .lesson-desc code {
    background: var(--bg-700);
    padding: 2px 7px;
    border-radius: 4px;
    color: var(--success);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    border: 1px solid var(--border);
  }
  
  .lesson-desc pre {
    background: var(--bg-800);
    padding: 14px 18px;
    border-radius: 6px;
    border-left: 4px solid var(--brand);
    overflow-x: auto;
    margin: 14px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-200);
  }
  
  .lesson-desc pre code {
    background: transparent;
    padding: 0;
    border: none;
    color: inherit;
    font-size: inherit;
  }
  
  .lesson-desc ul, .lesson-desc ol {
    margin: 12px 0 12px 28px;
    line-height: 1.8;
  }
  
  .lesson-desc li { margin-bottom: 6px; }
  .lesson-desc strong { color: var(--brand); font-weight: 600; }
  .lesson-desc em { color: var(--text-300); font-style: italic; }
  
  .task-box {
    background: linear-gradient(135deg, rgba(241, 190, 50, 0.08), rgba(241, 190, 50, 0.02));
    border: 1px solid var(--brand-dark);
    border-left: 4px solid var(--brand);
    padding: 14px 18px;
    border-radius: 6px;
    margin-top: 16px;
  }
  
  .task-box strong {
    display: block;
    color: var(--brand);
    margin-bottom: 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  /* ============ EDITOR ============ */
  .editor-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg-800);
    overflow: hidden;
    min-height: 0;
  }
  
  .toolbar {
    padding: 10px 16px;
    background: var(--bg-700);
    display: flex;
    gap: 8px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  
  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
  }
  
  .btn-primary {
    background: var(--brand);
    color: var(--bg-900);
  }
  
  .btn-primary:hover:not(:disabled) {
    background: var(--brand-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(241, 190, 50, 0.3);
  }
  
  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  
  .btn-ghost {
    background: transparent;
    color: var(--text-200);
    border: 1px solid var(--border);
  }
  
  .btn-ghost:hover {
    background: var(--bg-600);
    color: var(--text-100);
  }
  
  .btn-hint {
    background: rgba(155, 93, 229, 0.15);
    color: var(--purple);
    border: 1px solid var(--purple);
  }
  
  .btn-hint:hover {
    background: rgba(155, 93, 229, 0.25);
  }
  
  .btn-solution {
    background: rgba(59, 154, 224, 0.15);
    color: var(--info);
    border: 1px solid var(--info);
  }
  
  .btn-solution:hover {
    background: rgba(59, 154, 224, 0.25);
  }
  
  .toolbar-spacer { flex: 1; }
  
  .status-chip {
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .status-chip.ready { background: var(--bg-600); color: var(--text-300); }
  .status-chip.loading { background: rgba(241, 190, 50, 0.15); color: var(--brand); }
  .status-chip.success { background: rgba(172, 209, 87, 0.15); color: var(--success); }
  .status-chip.error { background: rgba(231, 24, 55, 0.15); color: var(--danger); }
  
  .status-chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  
  .status-chip.loading .dot { animation: pulse 1.5s infinite; }
  
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  
  /* CodeMirror overrides */
  .CodeMirror {
    height: 100% !important;
    font-family: 'JetBrains Mono', monospace !important;
    font-size: 14px !important;
    line-height: 1.6 !important;
    background: #1e1e1e !important;
  }
  
  .CodeMirror-gutters {
    background: #1e1e1e !important;
    border-right: 1px solid var(--border) !important;
  }
  
  .editor-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  
  .cm-wrap {
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }
  
  /* ============ CONSOLE ============ */
  .console {
    height: 170px;
    background: #0d0d1a;
    border-top: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  
  .console-header {
    padding: 6px 14px;
    background: var(--bg-700);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-400);
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  
  .console-clear {
    background: transparent;
    border: none;
    color: var(--text-400);
    cursor: pointer;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 3px;
  }
  
  .console-clear:hover { background: var(--bg-600); color: var(--text-200); }
  
  .console-output {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.5;
  }
  
  .console-output::-webkit-scrollbar { width: 8px; }
  .console-output::-webkit-scrollbar-thumb { background: var(--bg-600); border-radius: 4px; }
  
  .c-line {
    margin-bottom: 3px;
    white-space: pre-wrap;
    word-break: break-word;
    padding: 2px 0;
  }
  
  .c-out { color: var(--text-200); }
  .c-err { color: var(--danger); }
  .c-pass { color: var(--success); }
  .c-fail { color: var(--danger); }
  .c-info { color: var(--info); }
  .c-dim { color: var(--text-400); }
  
  /* ============ LOADING SCREEN ============ */
  .loading-screen {
    position: fixed;
    inset: 0;
    background: var(--bg-900);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    gap: 20px;
  }
  
  .loading-screen.hidden { display: none; }
  
  .loader-logo {
    width: 80px;
    height: 80px;
    background: var(--brand);
    color: var(--bg-900);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 36px;
    font-family: 'JetBrains Mono', monospace;
    animation: bounce 1.2s ease-in-out infinite;
  }
  
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--bg-600);
    border-top-color: var(--brand);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .loading-text {
    color: var(--brand);
    font-size: 18px;
    font-weight: 600;
  }
  
  .loading-sub {
    color: var(--text-400);
    font-size: 13px;
  }
  
  /* ============ TOAST ============ */
  .toast-container {
    position: fixed;
    top: 70px;
    right: 20px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  
  .toast {
    background: var(--bg-800);
    border: 1px solid var(--border);
    border-left: 4px solid var(--brand);
    padding: 12px 16px;
    border-radius: 6px;
    box-shadow: var(--shadow-lg);
    min-width: 280px;
    max-width: 400px;
    animation: slideIn 0.3s ease-out;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .toast.success { border-left-color: var(--success); }
  .toast.error { border-left-color: var(--danger); }
  .toast.info { border-left-color: var(--info); }
  
  .toast-icon { font-size: 18px; }
  .toast-msg { flex: 1; font-size: 13px; }
  
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  
  @keyframes slideOut {
    to { transform: translateX(100%); opacity: 0; }
  }
  
  .toast.hiding { animation: slideOut 0.3s ease-in forwards; }
  
  /* ============ MODAL ============ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 3000;
    backdrop-filter: blur(4px);
  }
  
  .modal-overlay.active { display: flex; }
  
  .modal {
    background: var(--bg-800);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 30px;
    max-width: 500px;
    width: 90%;
    box-shadow: var(--shadow-lg);
    animation: modalIn 0.3s ease-out;
  }
  
  @keyframes modalIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  
  .modal h3 {
    color: var(--brand);
    margin-bottom: 12px;
    font-size: 20px;
  }
  
  .modal p {
    margin-bottom: 12px;
    line-height: 1.6;
    color: var(--text-200);
  }
  
  .modal pre {
    background: var(--bg-900);
    padding: 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    overflow-x: auto;
    margin: 12px 0;
    color: var(--success);
  }
  
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
  }
  
  /* ============ RESPONSIVE ============ */
  @media (max-width: 1100px) {
    .sidebar { width: 280px; }
    .progress-bar { width: 160px; }
    .stat-badge:not(:last-child) { display: none; }
  }
  
  @media (max-width: 768px) {
    .sidebar { width: 240px; }
    .lesson-desc { padding: 20px; }
    .logo-text { display: none; }
    .progress-bar { width: 120px; }
    .header-stats { gap: 8px; }
  }
</style>
</head>
<body>

<div id="loadingScreen" class="loading-screen">
  <div class="loader-logo">Py</div>
  <div class="loading-text">Загрузка Python в браузере...</div>
  <div class="spinner"></div>
  <div class="loading-sub">Pyodide ~10 МБ • Первый запуск может занять время</div>
</div>

<header>
  <div class="logo" onclick="showWelcome()">
    <div class="logo-icon">Py</div>
    <div class="logo-text">Camp<span>.</span></div>
  </div>
  
  <div class="header-stats">
    <div class="stat-badge" title="Пройдено уроков">
      <span class="icon">✓</span>
      <span class="value" id="statCompleted">0</span>
    </div>
    <div class="stat-badge" title="Всего уроков">
      <span class="icon">📚</span>
      <span class="value" id="statTotal">0</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill" style="width: 0%"></div>
      </div>
      <div class="progress-text" id="progressText">0%</div>
    </div>
  </div>
</header>

<div class="main">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Программа курса</div>
    </div>
  </aside>
  
  <main class="content">
    <div class="lesson-desc" id="lessonDesc"></div>
    
    <div class="editor-wrap">
      <div class="toolbar">
        <button class="btn btn-primary" id="runBtn" onclick="runCode()">
          <span>▶</span> Запустить (Ctrl+Enter)
        </button>
        <button class="btn btn-ghost" onclick="resetCode()">
          <span>↺</span> Сбросить
        </button>
        <button class="btn btn-hint" onclick="showHint()">
          <span>💡</span> Подсказка
        </button>
        <button class="btn btn-solution" onclick="showSolution()">
          <span>🔑</span> Решение
        </button>
        <div class="toolbar-spacer"></div>
        <button class="btn btn-ghost" onclick="prevLesson()">← Назад</button>
        <button class="btn btn-ghost" onclick="nextLesson()">Далее →</button>
        <div class="status-chip ready" id="statusChip">
          <span class="dot"></span>
          <span id="statusText">Готово</span>
        </div>
      </div>
      
      <div class="editor-container">
        <div class="cm-wrap">
          <textarea id="codeEditor"></textarea>
        </div>
        
        <div class="console">
          <div class="console-header">
            <span>🖥 Консоль</span>
            <button class="console-clear" onclick="clearConsole()">Очистить</button>
          </div>
          <div class="console-output" id="consoleOutput"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

// ============ СОСТОЯНИЕ ============
let pyodide = null;
let editor = null;
let currentLessonIdx = 0;
let completedLessons = new Set(JSON.parse(localStorage.getItem('pycamp_completed_v2') || '[]'));
const allLessons = [];
COURSE.forEach(m => m.lessons.forEach(l => allLessons.push(l)));

// ============ ИНИЦИАЛИЗАЦИЯ ============
async function init() {
  try {
    // Инициализация CodeMirror
    editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
      mode: 'python',
      theme: 'material-darker',
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      matchBrackets: true,
      indentWithTabs: false,
      lineWrapping: false,
      extraKeys: {
        'Ctrl-Enter': () => runCode(),
        'Cmd-Enter': () => runCode(),
        'Tab': (cm) => cm.replaceSelection('    ', 'end')
      }
    });
    
    setStatus('Загрузка Pyodide...', 'loading');
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';
    document.head.appendChild(script);
    await new Promise((res, rej) => { script.onload = res; script.onerror = rej; });
    pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/' });
    
    document.getElementById('loadingScreen').classList.add('hidden');
    setStatus('Готово', 'ready');
    renderSidebar();
    loadLesson(currentLessonIdx);
    updateStats();
    
    setTimeout(() => showToast('Добро пожаловать в PyCamp! 🐍', 'info'), 500);
  } catch (e) {
    document.getElementById('loadingScreen').innerHTML =
      `<div style="color: var(--danger); text-align: center; padding: 20px; max-width: 500px;">
        <div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>
        <h2 style="margin-bottom: 10px;">Ошибка загрузки</h2>
        <p style="margin-bottom: 10px;">Не удалось загрузить Pyodide. Проверьте интернет-соединение.</p>
        <p style="font-size: 12px; color: var(--text-400); margin-bottom: 20px;">${e.message}</p>
        <button class="btn btn-primary" onclick="location.reload()">Повторить</button>
      </div>`;
  }
}

// ============ РЕНДЕРИНГ ============
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '<div class="sidebar-header"><div class="sidebar-title">Программа курса</div></div>';
  let globalIdx = 0;
  COURSE.forEach((mod, mi) => {
    const div = document.createElement('div');
    div.className = 'module' + (mi === 0 ? '' : ' collapsed');
    const header = document.createElement('div');
    header.className = 'module-header';
    header.innerHTML = `<span>${mod.module}</span><span class="arrow">▼</span>`;
    header.onclick = () => div.classList.toggle('collapsed');
    div.appendChild(header);
    const list = document.createElement('div');
    list.className = 'lesson-list';
    mod.lessons.forEach((l) => {
      const item = document.createElement('div');
      item.className = 'lesson-item' + (globalIdx === currentLessonIdx ? ' active' : '') + (completedLessons.has(globalIdx) ? ' completed' : '');
      item.innerHTML = `<span class="check-icon">${completedLessons.has(globalIdx) ? '✓' : '○'}</span><span class="lesson-title-text">${l.title}</span>`;
      const idx = globalIdx;
      item.onclick = () => loadLesson(idx);
      list.appendChild(item);
      globalIdx++;
    });
    div.appendChild(list);
    sb.appendChild(div);
  });
}

function loadLesson(idx) {
  if (idx < 0 || idx >= allLessons.length) return;
  currentLessonIdx = idx;
  const lesson = allLessons[idx];
  document.getElementById('lessonDesc').innerHTML = lesson.desc;
  const saved = localStorage.getItem('pycamp_code_v2_' + idx);
  editor.setValue(saved !== null ? saved : lesson.initial);
  clearConsole();
  renderSidebar();
  document.getElementById('lessonDesc').scrollTop = 0;
  // Прокручиваем активный урок в сайдбаре в вид
  const active = document.querySelector('.lesson-item.active');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function resetCode() {
  const lesson = allLessons[currentLessonIdx];
  editor.setValue(lesson.initial);
  localStorage.removeItem('pycamp_code_v2_' + currentLessonIdx);
  clearConsole();
  showToast('Код сброшен', 'info');
}

function prevLesson() { loadLesson(currentLessonIdx - 1); }
function nextLesson() { loadLesson(currentLessonIdx + 1); }

function updateStats() {
  const total = allLessons.length;
  const done = completedLessons.size;
  const pct = Math.round((done / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '%';
  document.getElementById('statCompleted').textContent = done;
  document.getElementById('statTotal').textContent = total;
  
  // Проверка завершения курса
  if (done === total && !localStorage.getItem('pycamp_certified')) {
    setTimeout(showCertificate, 800);
  }
}

function setStatus(text, cls) {
  const chip = document.getElementById('statusChip');
  chip.className = 'status-chip ' + (cls || 'ready');
  document.getElementById('statusText').textContent = text;
}

function clearConsole() {
  document.getElementById('consoleOutput').innerHTML = '';
}

function logToConsole(text, cls) {
  const c = document.getElementById('consoleOutput');
  const d = document.createElement('div');
  d.className = 'c-line ' + (cls || 'c-out');
  d.textContent = text;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}

// ============ TOAST ============
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  const icons = { success: '✓', error: '✗', info: 'ℹ' };
  toast.innerHTML = `<span class="toast-icon">${icons[type] || 'ℹ'}</span><span class="toast-msg">${msg}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('hiding');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// ============ MODAL ============
function openModal(html) {
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function showHint() {
  const lesson = allLessons[currentLessonIdx];
  if (!lesson.hint) return;
  openModal(`
    <h3>💡 Подсказка</h3>
    <p>${lesson.hint}</p>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="closeModal()">Понятно</button>
    </div>
  `);
}

function showSolution() {
  const lesson = allLessons[currentLessonIdx];
  if (!lesson.solution) return;
  openModal(`
    <h3>🔑 Решение</h3>
    <p>Показать решение? Если вы используете его — попробуйте сначала разобраться, как он работает.</p>
    <pre>${escapeHtml(lesson.solution)}</pre>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Закрыть</button>
      <button class="btn btn-primary" onclick="applySolution()">Вставить в редактор</button>
    </div>
  `);
}

function applySolution() {
  const lesson = allLessons[currentLessonIdx];
  editor.setValue(lesson.solution);
  closeModal();
  showToast('Решение вставлено. Изучите его!', 'info');
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showCertificate() {
  if (localStorage.getItem('pycamp_certified')) return;
  localStorage.setItem('pycamp_certified', '1');
  const date = new Date().toLocaleDateString('ru-RU');
  openModal(`
    <h3>🎉 Поздравляем!</h3>
    <p>Вы прошли <strong>полный курс Python</strong> в PyCamp!</p>
    <p style="color: var(--text-300); font-size: 13px;">Сертификат выдан: ${date}</p>
    <pre style="text-align: center; color: var(--brand); font-size: 14px;">
╔═══════════════════════════════════╗
║   СЕРТИФИКАТ PYCAMP              ║
║                                   ║
║   Python Developer                ║
║   ${String(allLessons.length).padStart(2, '0')} уроков пройдено                    ║
╚═══════════════════════════════════╝</pre>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="closeModal()">Спасибо!</button>
    </div>
  `);
}

function showWelcome() {
  openModal(`
    <h3>🐍 PyCamp — интерактивный курс Python</h3>
    <p>Добро пожаловать! Здесь вы изучите Python с нуля до продвинутого уровня.</p>
    <p><strong>Возможности:</strong></p>
    <ul style="margin-left: 20px; line-height: 1.8;">
      <li>${allLessons.length} интерактивных уроков</li>
      <li>Настоящий Python в браузере (Pyodide)</li>
      <li>Автоматическая проверка заданий</li>
      <li>Подсказки и решения</li>
      <li>Сохранение прогресса</li>
    </ul>
    <p style="color: var(--text-300); font-size: 13px; margin-top: 12px;">Прогресс: ${completedLessons.size} / ${allLessons.length}</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="if(confirm('Сбросить весь прогресс?')){localStorage.clear();location.reload();}">Сбросить прогресс</button>
      <button class="btn btn-primary" onclick="closeModal()">Начать!</button>
    </div>
  `);
}

// ============ ЗАПУСК КОДА ============
editor && editor.on && editor.on('change', () => {
  localStorage.setItem('pycamp_code_v2_' + currentLessonIdx, editor.getValue());
});

// Подписка на изменения после инициализации
function setupEditorEvents() {
  editor.on('change', () => {
    localStorage.setItem('pycamp_code_v2_' + currentLessonIdx, editor.getValue());
  });
}

async function runCode() {
  if (!pyodide) { logToConsole('Python ещё не загружен', 'c-err'); return; }
  const code = editor.getValue();
  const lesson = allLessons[currentLessonIdx];
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  setStatus('Выполнение...', 'loading');
  clearConsole();
  logToConsole('▶ Запуск кода...', 'c-info');

  try {
    // Безопасная передача кода через JSON
    pyodide.globals.set('_user_code', code);
    pyodide.runPython(`
import sys
from io import StringIO
_globals = {"__builtins__": __builtins__}
_stdout_buf = StringIO()
_stderr_buf = StringIO()
sys.stdout = _stdout_buf
sys.stderr = _stderr_buf
_run_error = None
try:
    exec(compile(_user_code, "<user>", "exec"), _globals)
except Exception as _e:
    _run_error = repr(_e)
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
_src = _user_code
`);
    const stdout = pyodide.runPython('_stdout_buf.getvalue()');
    const stderr = pyodide.runPython('_stderr_buf.getvalue()');
    const runError = pyodide.runPython('_run_error');

    if (stdout) logToConsole(stdout, 'c-out');
    if (stderr) logToConsole(stderr, 'c-err');
    if (runError && runError !== 'None') {
      logToConsole('Ошибка: ' + runError, 'c-err');
      setStatus('Ошибка', 'error');
      btn.disabled = false;
      return;
    }

    logToConsole('\n─── Проверка тестов ───', 'c-dim');
    let allPassed = true;
    for (let i = 0; i < lesson.tests.length; i++) {
      const t = lesson.tests[i];
      try {
        pyodide.globals.set('_test_stdout', stdout);
        pyodide.globals.set('_test_src', code);
        pyodide.globals.set('_test_code', t.code);
        pyodide.runPython(`
_globals_copy = dict(_globals)
_globals_copy['_stdout'] = _test_stdout
_globals_copy['_src'] = _test_src
exec(compile(_test_code, "<test>", "exec"), _globals_copy)
`);
        logToConsole(`✓ Тест ${i + 1} пройден`, 'c-pass');
      } catch (e) {
        allPassed = false;
        const msg = t.msg || e.message;
        logToConsole(`✗ Тест ${i + 1}: ${msg}`, 'c-fail');
      }
    }

    if (allPassed) {
      logToConsole('\n🎉 Все тесты пройдены! Урок завершён.', 'c-pass');
      setStatus('Урок пройден!', 'success');
      if (!completedLessons.has(currentLessonIdx)) {
        completedLessons.add(currentLessonIdx);
        localStorage.setItem('pycamp_completed_v2', JSON.stringify([...completedLessons]));
        updateStats();
        renderSidebar();
        showToast('Урок пройден! 🎉', 'success');
        // Автопереход к следующему уроку
        if (currentLessonIdx < allLessons.length - 1) {
          setTimeout(() => {
            if (confirm('Перейти к следующему уроку?')) {
              nextLesson();
            }
          }, 1000);
        }
      } else {
        showToast('Урок уже пройден', 'info');
      }
    } else {
      setStatus('Есть ошибки', 'error');
      showToast('Не все тесты пройдены', 'error');
    }
  } catch (e) {
    logToConsole('Ошибка: ' + e.message, 'c-err');
    setStatus('Ошибка', 'error');
  } finally {
    btn.disabled = false;
  }
}

// Запуск после полной инициализации
window.addEventListener('load', () => {
  init().then(() => {
    if (editor) setupEditorEvents();
  });
});
</script>
