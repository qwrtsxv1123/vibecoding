<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Интерактивный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a23;
    --bg2: #1b1b32;
    --bg3: #2a2a40;
    --accent: #dfdfe2;
    --green: #acd157;
    --green-dark: #3b7a3b;
    --text: #f5f5f5;
    --muted: #9999aa;
    --danger: #ff6b6b;
    --success: #4ade80;
    --border: #3d3d56;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--bg2);
    border-bottom: 2px solid var(--green);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .logo {
    font-size: 24px;
    font-weight: 700;
    color: var(--green);
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--text); }
  .progress-bar {
    flex: 1;
    max-width: 400px;
    height: 10px;
    background: var(--bg3);
    border-radius: 5px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    transition: width 0.4s;
    width: 0%;
  }
  .progress-text { font-size: 13px; color: var(--muted); }
  .menu-toggle {
    display: none;
    background: var(--green);
    color: var(--bg);
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
  }
  .container {
    display: flex;
    flex: 1;
    min-height: 0;
  }
  aside {
    width: 320px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0;
  }
  .module {
    margin-bottom: 8px;
  }
  .module-title {
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .module-title:hover { background: var(--bg3); }
  .module-title .arrow { transition: transform 0.2s; }
  .module.collapsed .arrow { transform: rotate(-90deg); }
  .module.collapsed .lesson-list { display: none; }
  .lesson-list { list-style: none; }
  .lesson-item {
    padding: 10px 20px 10px 32px;
    font-size: 14px;
    cursor: pointer;
    border-left: 3px solid transparent;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s;
  }
  .lesson-item:hover { background: var(--bg3); }
  .lesson-item.active {
    background: var(--bg3);
    border-left-color: var(--green);
    color: var(--green);
  }
  .lesson-item.completed .check {
    color: var(--success);
  }
  .check {
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    flex-shrink: 0;
  }
  .lesson-item.completed .check {
    border-color: var(--success);
    background: var(--success);
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .lesson-view {
    flex: 1;
    overflow-y: auto;
    padding: 32px 48px;
    max-width: 900px;
  }
  .lesson-view h1 {
    color: var(--green);
    margin-bottom: 16px;
    font-size: 28px;
  }
  .lesson-view h2 {
    color: var(--accent);
    margin: 24px 0 12px;
    font-size: 20px;
  }
  .lesson-view p {
    line-height: 1.7;
    margin-bottom: 12px;
    color: var(--accent);
  }
  .lesson-view ul, .lesson-view ol {
    margin: 12px 0 12px 24px;
    line-height: 1.7;
    color: var(--accent);
  }
  .lesson-view code {
    background: var(--bg3);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: "Consolas", "Monaco", monospace;
    color: var(--green);
    font-size: 0.95em;
  }
  .lesson-view pre {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 18px;
    margin: 12px 0;
    overflow-x: auto;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 14px;
    line-height: 1.5;
  }
  .lesson-view pre code {
    background: none;
    padding: 0;
    color: var(--accent);
  }
  .info-box {
    background: rgba(172, 209, 87, 0.08);
    border-left: 4px solid var(--green);
    padding: 12px 16px;
    margin: 16px 0;
    border-radius: 0 6px 6px 0;
  }
  .task-box {
    background: var(--bg2);
    border: 2px solid var(--green);
    border-radius: 8px;
    padding: 20px;
    margin: 24px 0;
  }
  .task-box h3 {
    color: var(--green);
    margin-bottom: 10px;
    font-size: 18px;
  }
  .editor-section {
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 45vh;
    min-height: 300px;
  }
  .editor-toolbar {
    padding: 10px 16px;
    background: var(--bg3);
    display: flex;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .btn {
    background: var(--green);
    color: var(--bg);
    border: none;
    padding: 8px 18px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--bg3); }
  .btn-danger {
    background: var(--danger);
    color: white;
  }
  #codeEditor {
    flex: 1;
    background: var(--bg);
    color: var(--accent);
    border: none;
    padding: 16px;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 14px;
    line-height: 1.6;
    resize: none;
    outline: none;
    tab-size: 4;
  }
  .output-section {
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    max-height: 180px;
    overflow-y: auto;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 13px;
  }
  .output-section .label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .output-line { margin: 2px 0; white-space: pre-wrap; word-break: break-word; }
  .output-line.error { color: var(--danger); }
  .output-line.success { color: var(--success); }
  .output-line.info { color: var(--muted); }
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 35, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    z-index: 1000;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid var(--bg3);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .welcome {
    text-align: center;
    padding: 60px 20px;
  }
  .welcome h1 {
    font-size: 42px;
    color: var(--green);
    margin-bottom: 16px;
  }
  .welcome p {
    font-size: 18px;
    color: var(--accent);
    max-width: 600px;
    margin: 0 auto 24px;
    line-height: 1.6;
  }
  .stats {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 32px 0;
  }
  .stat-card {
    background: var(--bg2);
    padding: 20px 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    min-width: 140px;
  }
  .stat-card .num {
    font-size: 32px;
    color: var(--green);
    font-weight: 700;
  }
  .stat-card .lbl {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
  }
  @media (max-width: 900px) {
    .menu-toggle { display: block; }
    aside {
      position: fixed;
      left: -320px;
      top: 0;
      bottom: 0;
      z-index: 100;
      transition: left 0.3s;
    }
    aside.open { left: 0; }
    .lesson-view { padding: 20px; }
    .lesson-view h1 { font-size: 22px; }
    .welcome h1 { font-size: 28px; }
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border); }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div style="color: var(--green); font-size: 18px;">Загружаем Python в браузере...</div>
  <div style="color: var(--muted); font-size: 13px;">Первый запуск может занять 15–30 секунд</div>
</div>

<header>
  <div class="logo">Py<span>Camp</span></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">0 / 0 уроков</div>
  <button class="menu-toggle" id="menuToggle">☰ Меню</button>
</header>

<div class="container">
  <aside id="sidebar">
    <div id="modulesList"></div>
  </aside>

  <main>
    <div class="lesson-view" id="lessonView"></div>
    <div class="editor-section" id="editorSection" style="display:none;">
      <div class="editor-toolbar">
        <button class="btn" id="runBtn">▶ Запустить</button>
        <button class="btn btn-secondary" id="resetBtn">↺ Сбросить</button>
        <button class="btn btn-secondary" id="solutionBtn">💡 Решение</button>
        <button class="btn btn-secondary" id="nextBtn">Далее →</button>
        <span style="margin-left:auto; color: var(--muted); font-size: 12px;" id="statusText"></span>
      </div>
      <textarea id="codeEditor" spellcheck="false"></textarea>
      <div class="output-section">
        <div class="label">Вывод / Результат</div>
        <div id="outputArea"></div>
      </div>
    </div>
  </main>
</div>

<script>
// ============ ДАННЫЕ КУРСА ============
const COURSE = [
  {
    title: "Модуль 1: Основы Python",
    lessons: [
      {
        id: "1.1",
        title: "Привет, Python!",
        theory: `
          <h1>Привет, Python!</h1>
          <p>Добро пожаловать в интерактивный курс Python! Python — один из самых популярных языков программирования в мире. Он используется в веб-разработке, анализе данных, машинном обучении, автоматизации и многом другом.</p>
          <p>Первая программа на любом языке — это вывод текста на экран. В Python для этого используется функция <code>print()</code>.</p>
          <pre><code>print("Привет, мир!")
print("Я учу Python")</code></pre>
          <div class="info-box">💡 Строки в Python заключаются в кавычки — одинарные <code>'...'</code> или двойные <code>"..."</code>.</div>
        `,
        task: "Выведите на экран фразу <b>Hello, Python!</b> (именно так, с большой H и восклицательным знаком).",
        starterCode: '# Напишите ваш код здесь\n',
        solution: 'print("Hello, Python!")',
        tests: [
          { type: "output", expected: "Hello, Python!", description: "Вывод содержит 'Hello, Python!'" }
        ]
      },
      {
        id: "1.2",
        title: "Переменные",
        theory: `
          <h1>Переменные</h1>
          <p>Переменная — это именованная ячейка памяти, в которой хранится значение. В Python не нужно указывать тип переменной — он определяется автоматически.</p>
          <pre><code>name = "Алиса"
age = 25
height = 1.68
is_student = True

print(name)
print(age)</code></pre>
          <h2>Правила именования</h2>
          <ul>
            <li>Имя может содержать буквы, цифры и символ подчёркивания <code>_</code></li>
            <li>Не может начинаться с цифры</li>
            <li>Регистр имеет значение: <code>Name</code> и <code>name</code> — разные переменные</li>
            <li>Нельзя использовать ключевые слова Python (<code>if</code>, <code>for</code>, <code>class</code> и т.д.)</li>
          </ul>
          <div class="info-box">💡 Принято использовать snake_case для имён переменных: <code>user_name</code>, <code>total_price</code>.</div>
        `,
        task: "Создайте переменную <code>language</code> со значением <code>\"Python\"</code> и выведите её на экран.",
        starterCode: '# Создайте переменную language и выведите её\n',
        solution: 'language = "Python"\nprint(language)',
        tests: [
          { type: "output", expected: "Python", description: "Вывод содержит 'Python'" },
          { type: "code", pattern: "language\\s*=", description: "Использована переменная language" }
        ]
      },
      {
        id: "1.3",
        title: "Типы данных",
        theory: `
          <h1>Типы данных</h1>
          <p>В Python есть несколько основных типов данных:</p>
          <ul>
            <li><b>int</b> — целые числа: <code>42</code>, <code>-7</code>, <code>0</code></li>
            <li><b>float</b> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
            <li><b>str</b> — строки: <code>"привет"</code></li>
            <li><b>bool</b> — логический тип: <code>True</code> или <code>False</code></li>
            <li><b>NoneType</b> — отсутствие значения: <code>None</code></li>
          </ul>
          <p>Узнать тип переменной можно с помощью функции <code>type()</code>:</p>
          <pre><code>x = 10
print(type(x))   # &lt;class 'int'&gt;

y = "hello"
print(type(y))   # &lt;class 'str'&gt;</code></pre>
        `,
        task: "Создайте переменную <code>pi</code> со значением <code>3.14</code> и выведите её тип (должно получиться <code>&lt;class 'float'&gt;</code>).",
        starterCode: '# Создайте pi и выведите её тип\n',
        solution: 'pi = 3.14\nprint(type(pi))',
        tests: [
          { type: "output", expected: "<class 'float'>", description: "Вывод содержит <class 'float'>" }
        ]
      },
      {
        id: "1.4",
        title: "Ввод данных",
        theory: `
          <h1>Ввод данных от пользователя</h1>
          <p>Чтобы получить данные от пользователя, используется функция <code>input()</code>. Она всегда возвращает строку!</p>
          <pre><code>name = input("Как тебя зовут? ")
print("Привет, " + name)</code></pre>
          <p>Если нужно число, его нужно преобразовать с помощью <code>int()</code> или <code>float()</code>:</p>
          <pre><code>age = int(input("Сколько тебе лет? "))
print("Через год тебе будет", age + 1)</code></pre>
          <div class="info-box">⚠️ В нашей среде ввод данных работает через специальную функцию. Для тестов используйте значения напрямую.</div>
        `,
        task: "Создайте переменную <code>year</code> со значением <code>2026</code> (целое число) и выведите её.",
        starterCode: '# Создайте переменную year со значением 2026 и выведите её\n',
        solution: 'year = 2026\nprint(year)',
        tests: [
          { type: "output", expected: "2026", description: "Вывод содержит 2026" },
          { type: "code", pattern: "year\\s*=\\s*2026", description: "year равно 2026" }
        ]
      }
    ]
  },
  {
    title: "Модуль 2: Операторы",
    lessons: [
      {
        id: "2.1",
        title: "Арифметические операторы",
        theory: `
          <h1>Арифметические операторы</h1>
          <p>Python поддерживает все стандартные математические операции:</p>
          <ul>
            <li><code>+</code> — сложение</li>
            <li><code>-</code> — вычитание</li>
            <li><code>*</code> — умножение</li>
            <li><code>/</code> — деление (всегда float)</li>
            <li><code>//</code> — целочисленное деление</li>
            <li><code>%</code> — остаток от деления</li>
            <li><code>**</code> — возведение в степень</li>
          </ul>
          <pre><code>a = 17
b = 5
print(a + b)    # 22
print(a / b)    # 3.4
print(a // b)   # 3
print(a % b)    # 2
print(a ** b)   # 1419857</code></pre>
        `,
        task: "Вычислите и выведите результат: 2 в степени 10 (должно получиться <code>1024</code>).",
        starterCode: '# Вычислите 2 ** 10 и выведите результат\n',
        solution: 'print(2 ** 10)',
        tests: [
          { type: "output", expected: "1024", description: "Вывод: 1024" }
        ]
      },
      {
        id: "2.2",
        title: "Операторы сравнения",
        theory: `
          <h1>Операторы сравнения</h1>
          <p>Операторы сравнения возвращают <code>True</code> или <code>False</code>:</p>
          <ul>
            <li><code>==</code> — равно</li>
            <li><code>!=</code> — не равно</li>
            <li><code>&gt;</code> — больше</li>
            <li><code>&lt;</code> — меньше</li>
            <li><code>&gt;=</code> — больше или равно</li>
            <li><code>&lt;=</code> — меньше или равно</li>
          </ul>
          <pre><code>print(5 == 5)    # True
print(5 != 3)    # True
print(5 &gt; 10)    # False
print(5 &lt;= 5)    # True</code></pre>
          <div class="info-box">⚠️ Не путайте <code>=</code> (присваивание) и <code>==</code> (сравнение)!</div>
        `,
        task: "Выведите результат сравнения: 100 больше 99 (должно быть <code>True</code>).",
        starterCode: '# Выведите результат сравнения 100 > 99\n',
        solution: 'print(100 > 99)',
        tests: [
          { type: "output", expected: "True", description: "Вывод: True" }
        ]
      },
      {
        id: "2.3",
        title: "Логические операторы",
        theory: `
          <h1>Логические операторы</h1>
          <p>Для построения сложных условий используются:</p>
          <ul>
            <li><code>and</code> — И (оба условия истинны)</li>
            <li><code>or</code> — ИЛИ (хотя бы одно истинно)</li>
            <li><code>not</code> — НЕ (инвертирует)</li>
          </ul>
          <pre><code>age = 25
has_ticket = True

# Человек совершеннолетний И имеет билет
print(age >= 18 and has_ticket)  # True

# Возраст меньше 12 ИЛИ больше 65
print(age < 12 or age > 65)      # False

# НЕ имеет билета
print(not has_ticket)            # False</code></pre>
        `,
        task: "Создайте переменную <code>x = 15</code> и выведите результат выражения: <code>x > 10 and x < 20</code>.",
        starterCode: 'x = 15\n# Выведите x > 10 and x < 20\n',
        solution: 'x = 15\nprint(x > 10 and x < 20)',
        tests: [
          { type: "output", expected: "True", description: "Вывод: True" }
        ]
      },
      {
        id: "2.4",
        title: "Строки и форматирование",
        theory: `
          <h1>Работа со строками</h1>
          <p>Строки можно объединять (конкатенация) и умножать:</p>
          <pre><code>first = "Hello"
second = "World"
print(first + " " + second)  # Hello World
print("Ha" * 3)              # HaHaHa</code></pre>
          <h2>f-строки (современный способ)</h2>
          <p>Самый удобный способ вставки переменных в строку:</p>
          <pre><code>name = "Алиса"
age = 25
print(f"Меня зовут {name}, мне {age} лет")
print(f"Через 5 лет мне будет {age + 5}")</code></pre>
        `,

      {
        id: "13.3",
        title: "Поздравляем! 🎉",
        theory: `
          <h1>Поздравляем! 🎉</h1>
          <p>Вы прошли весь курс PyCamp! Теперь вы знаете:</p>
          <ul>
            <li>✓ Основы синтаксиса Python</li>
            <li>✓ Переменные и типы данных</li>
            <li>✓ Условия и циклы</li>
            <li>✓ Функции и область видимости</li>
            <li>✓ Списки, словари, множества, кортежи</li>
            <li>✓ Строки и их методы</li>
            <li>✓ Обработку ошибок</li>
            <li>✓ Работу с файлами</li>
            <li>✓ Модули и импорты</li>
            <li>✓ Объектно-ориентированное программирование</li>
          </ul>
          <h2>Что дальше?</h2>
          <ul>
            <li>📚 Практикуйтесь на реальных задачах (Codewars, LeetCode)</li>
            <li>🌐 Изучите веб-фреймворки: Flask, Django, FastAPI</li>
            <li>📊 Попробуйте анализ данных: pandas, numpy, matplotlib</li>
            <li>🤖 Загляните в машинное обучение: scikit-learn, TensorFlow</li>
            <li>🎮 Создайте игру: pygame</li>
          </ul>
          <div class="info-box">💡 <b>Главный секрет программирования</b> — практика. Пишите код каждый день, даже по 30 минут!</div>
        `,
        task: "Напишите финальную программу: выведите <code>I did it!</code> — и гордитесь собой!",
        starterCode: '# Ваша финальная программа!\n',
        solution: 'print("I did it!")',
        tests: [
          { type: "output", expected: "I did it!", description: "Вывод: I did it!" }
        ]
      }
    ]
  }
];

// ============ СОСТОЯНИЕ ============
let pyodide = null;
let currentLessonId = null;
let completedLessons = new Set();
let allLessons = [];
COURSE.forEach(m => m.lessons.forEach(l => allLessons.push(l)));

// ============ ИНИЦИАЛИЗАЦИЯ ============
window.addEventListener('load', async () => {
  loadProgress();
  renderSidebar();
  updateProgress();
  showWelcome();
  await initPyodide();
});

async function initPyodide() {
  try {
    pyodide = await loadPyodide();
    document.getElementById('loadingOverlay').style.display = 'none';
  } catch (e) {
    document.getElementById('loadingOverlay').innerHTML = 
      '<div style="color: var(--danger); text-align: center; padding: 20px;">Не удалось загрузить Python.<br>Проверьте интернет-соединение и обновите страницу.</div>';
  }
}

function loadProgress() {
  try {
    const saved = localStorage.getItem('pycamp_progress');
    if (saved) completedLessons = new Set(JSON.parse(saved));
  } catch (e) {}
}

function saveProgress() {
  try {
    localStorage.setItem('pycamp_progress', JSON.stringify([...completedLessons]));
  } catch (e) {}
}

function updateProgress() {
  const total = allLessons.length;
  const done = completedLessons.size;
  const pct = total ? (done / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${total} уроков`;
}

// ============ САЙДБАР ============
function renderSidebar() {
  const container = document.getElementById('modulesList');
  container.innerHTML = '';
  COURSE.forEach((module, mi) => {
    const moduleEl = document.createElement('div');
    moduleEl.className = 'module';
    const titleEl = document.createElement('div');
    titleEl.className = 'module-title';
    titleEl.innerHTML = `<span>${module.title}</span><span class="arrow">▼</span>`;
    titleEl.onclick = () => moduleEl.classList.toggle('collapsed');
    moduleEl.appendChild(titleEl);
    
    const list = document.createElement('ul');
    list.className = 'lesson-list';
    module.lessons.forEach(lesson => {
      const li = document.createElement('li');
      li.className = 'lesson-item';
      li.dataset.id = lesson.id;
      if (completedLessons.has(lesson.id)) li.classList.add('completed');
      li.innerHTML = `<span class="check">${completedLessons.has(lesson.id) ? '✓' : ''}</span><span>${lesson.id} ${lesson.title}</span>`;
      li.onclick = () => loadLesson(lesson.id);
      list.appendChild(li);
    });
    moduleEl.appendChild(list);
    container.appendChild(moduleEl);
  });
}

function updateSidebarActive() {
  document.querySelectorAll('.lesson-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === currentLessonId);
    el.classList.toggle('completed', completedLessons.has(el.dataset.id));
    el.querySelector('.check').textContent = completedLessons.has(el.dataset.id) ? '✓' : '';
  });
}

// ============ УРОКИ ============
function findLesson(id) {
  for (const m of COURSE) {
    for (const l of m.lessons) {
      if (l.id === id) return l;
    }
  }
  return null;
}

function showWelcome() {
  document.getElementById('editorSection').style.display = 'none';
  const view = document.getElementById('lessonView');
  const total = allLessons.length;
  const done = completedLessons.size;
  view.innerHTML = `
    <div class="welcome">
      <h1>Добро пожаловать в PyCamp!</h1>
      <p>Бесплатный интерактивный курс Python прямо в браузере. ${total} уроков, теория, примеры и задачи с автопроверкой.</p>
      <div class="stats">
        <div class="stat-card"><div class="num">${COURSE.length}</div><div class="lbl">модулей</div></div>
        <div class="stat-card"><div class="num">${total}</div><div class="lbl">уроков</div></div>
        <div class="stat-card"><div class="num">${done}</div><div class="lbl">пройдено</div></div>
      </div>
      <button class="btn" onclick="loadLesson('${done < total ? allLessons[done]?.id || allLessons[0].id : allLessons[0].id}')">
        ${done === 0 ? '▶ Начать обучение' : done === total ? '🎓 Повторить курс' : '▶ Продолжить'}
      </button>
      ${done > 0 ? `<button class="btn btn-danger" style="margin-left:10px;" onclick="resetProgress()">Сбросить прогресс</button>` : ''}
    </div>
  `;
}

function resetProgress() {
  if (confirm('Сбросить весь прогресс?')) {
    completedLessons.clear();
    saveProgress();
    updateProgress();
    renderSidebar();
    showWelcome();
  }
}

function loadLesson(id) {
  const lesson = findLesson(id);
  if (!lesson) return;
  currentLessonId = id;
  updateSidebarActive();
  
  const view = document.getElementById('lessonView');
  view.innerHTML = `
    ${lesson.theory}
    <div class="task-box">
      <h3>🎯 Задание</h3>
      <p>${lesson.task}</p>
    </div>
  `;
  view.scrollTop = 0;
  
  document.getElementById('editorSection').style.display = 'flex';
  document.getElementById('codeEditor').value = lesson.starterCode;
  document.getElementById('outputArea').innerHTML = '';
  document.getElementById('statusText').textContent = '';
  
  // Закрыть меню на мобильных
  document.getElementById('sidebar').classList.remove('open');
}

// ============ ВЫПОЛНЕНИЕ КОДА ============
document.getElementById('runBtn').addEventListener('click', runCode);
document.getElementById('resetBtn').addEventListener('click', () => {
  const lesson = findLesson(currentLessonId);
  if (lesson) document.getElementById('codeEditor').value = lesson.starterCode;
  document.getElementById('outputArea').innerHTML = '';
  document.getElementById('statusText').textContent = '';
});
document.getElementById('solutionBtn').addEventListener('click', () => {
  const lesson = findLesson(currentLessonId);
  if (lesson && confirm('Показать решение?')) {
    document.getElementById('codeEditor').value = lesson.solution;
  }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  const idx = allLessons.findIndex(l => l.id === currentLessonId);
  if (idx >= 0 && idx < allLessons.length - 1) {
    loadLesson(allLessons[idx + 1].id);
  } else {
    alert('Это последний урок! Поздравляем!');
    showWelcome();
  }
});

// Tab в textarea
document.getElementById('codeEditor').addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    ta.value = ta.value.substring(0, start) + '    ' + ta.value.substring(end);
    ta.selectionStart = ta.selectionEnd = start + 4;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runCode();
  }
});

async function runCode() {
  if (!pyodide) {
    alert('Python ещё загружается, подождите...');
    return;
  }
  const code = document.getElementById('codeEditor').value;
  const outputArea = document.getElementById('outputArea');
  const statusText = document.getElementById('statusText');
  outputArea.innerHTML = '';
  statusText.textContent = 'Выполняется...';
  document.getElementById('runBtn').disabled = true;
  
  try {
    // Перехват stdout/stderr
    pyodide.runPython(`
import sys
from io import StringIO
_stdout = StringIO()
_stderr = StringIO()
sys.stdout = _stdout
sys.stderr = _stderr
_pycamp_error = None
try:
${code.split('\n').map(l => '    ' + l).join('\n')}
except Exception as _e:
    _pycamp_error = str(_e)
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
_pycamp_out = _stdout.getvalue()
_pycamp_err = _stderr.getvalue()
`);
    const output = pyodide.globals.get('_pycamp_out');
    const errors = pyodide.globals.get('_pycamp_err');
    const exc = pyodide.globals.get('_pycamp_error');
    
    if (errors) {
      addOutput(errors, 'error');
    }
    if (exc && exc !== 'None') {
      addOutput('Ошибка: ' + exc, 'error');
      statusText.textContent = '❌ Ошибка выполнения';
    } else if (output) {
      addOutput(output.replace(/\n$/, ''), 'info');
      // Проверка тестов
      runTests(code, output);
    } else {
      addOutput('(нет вывода)', 'info');
      runTests(code, '');
    }
  } catch (e) {
    addOutput('Ошибка: ' + (e.message || e), 'error');
    statusText.textContent = '❌ Ошибка';
  } finally {
    document.getElementById('runBtn').disabled = false;
  }
}

function addOutput(text, cls) {
  const outputArea = document.getElementById('outputArea');
  const div = document.createElement('div');
  div.className = 'output-line ' + (cls || '');
  div.textContent = text;
  outputArea.appendChild(div);
}

function runTests(code, output) {
  const lesson = findLesson(currentLessonId);
  if (!lesson || !lesson.tests) return;
  
  const statusText = document.getElementById('statusText');
  const outputArea = document.getElementById('outputArea');
  const trimmedOutput = output.trim();
  let allPassed = true;
  
  lesson.tests.forEach(test => {
    let passed = false;
    if (test.type === 'output') {
      passed = trimmedOutput === test.expected.trim();
    } else if (test.type === 'code') {
      try {
        passed = new RegExp(test.pattern).test(code);
      } catch (e) {
        passed = code.includes(test.pattern);
      }
    }
    const div = document.createElement('div');
    div.className = 'output-line ' + (passed ? 'success' : 'error');
    div.textContent = (passed ? '✓ ' : '✗ ') + test.description;
    outputArea.appendChild(div);
    if (!passed) allPassed = false;
  });
  
  if (allPassed) {
    statusText.textContent = '✅ Все тесты пройдены!';
    if (!completedLessons.has(currentLessonId)) {
      completedLessons.add(currentLessonId);
      saveProgress();
      updateProgress();
      updateSidebarActive();
      const congr = document.createElement('div');
      congr.className = 'output-line success';
      congr.textContent = '🎉 Урок завершён! Можете переходить к следующему.';
      outputArea.appendChild(congr);
    }
  } else {
    statusText.textContent = '⚠️ Есть непройденные тесты';
  }
}

// Мобильное меню
document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});
</script>
