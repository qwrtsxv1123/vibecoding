<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — бесплатный курс Python</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
:root{
  --navy:#1b1b32;
  --navy-2:#2a2a40;
  --navy-3:#3b3b58;
  --accent:#f1be32;
  --green:#1f7a44;
  --green-l:#2ecc71;
  --red:#e74c3c;
  --bg:#f5f6f7;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  background:var(--bg);
  color:var(--navy);
  overflow:hidden;
}
button{font-family:inherit}

/* ---------- HEADER ---------- */
header{
  height:60px;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  position:relative;
  z-index:50;
}
.logo{
  font-weight:800;
  font-size:20px;
  letter-spacing:.5px;
  display:flex;
  align-items:center;
  gap:8px;
  white-space:nowrap;
}
.logo .py{
  background:var(--accent);
  color:var(--navy);
  padding:2px 8px;
  border-radius:6px;
  font-size:16px;
}
.header-progress{
  flex:1;
  max-width:420px;
  display:flex;
  align-items:center;
  gap:10px;
  margin-left:auto;
}
.pbar{
  flex:1;
  height:10px;
  background:var(--navy-3);
  border-radius:6px;
  overflow:hidden;
}
.pbar > div{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#f1be32,#2ecc71);
  border-radius:6px;
  transition:width .4s ease;
}
.progress-label{font-size:12.5px;color:#c9c9d9;white-space:nowrap}
#burger{
  display:none;
  background:none;border:none;color:#fff;font-size:22px;cursor:pointer;
}

/* ---------- LAYOUT ---------- */
.layout{display:flex;height:calc(100vh - 60px)}

/* ---------- SIDEBAR ---------- */
nav{
  width:310px;
  min-width:310px;
  background:var(--navy);
  color:#d7d7e6;
  overflow-y:auto;
  padding-bottom:40px;
}
nav::-webkit-scrollbar{width:8px}
nav::-webkit-scrollbar-thumb{background:#3b3b58;border-radius:4px}
.mod-title{
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:1.1px;
  color:#8b8ba7;
  padding:20px 18px 8px;
  font-weight:700;
  border-top:1px solid #2a2a40;
}
.mod-title:first-child{border-top:none}
.nav-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 18px;
  font-size:13.5px;
  cursor:pointer;
  border-left:3px solid transparent;
  transition:.15s;
  line-height:1.3;
}
.nav-item:hover{background:var(--navy-2);color:#fff}
.nav-item.active{background:var(--navy-2);border-left-color:var(--accent);color:#fff}
.nav-check{
  width:16px;height:16px;min-width:16px;
  border-radius:50%;
  border:2px solid #4a4a6a;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:#1b1b32;
}
.nav-item.done .nav-check{background:var(--green-l);border-color:var(--green-l)}
.nav-item.done{color:#9ee6b8}

/* ---------- MAIN ---------- */
main{
  flex:1;
  overflow-y:auto;
  padding:30px 44px 90px;
}
main::-webkit-scrollbar{width:10px}
main::-webkit-scrollbar-thumb{background:#cfd2d8;border-radius:5px}
.wrap{max-width:840px;margin:0 auto}

.crumb{font-size:12.5px;color:#7b7b93;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px}
h1.title{font-size:30px;margin:0 0 22px;line-height:1.2}

.theory{
  background:#fff;
  border-radius:12px;
  padding:24px 28px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  font-size:15.5px;
  line-height:1.7;
}
.theory h3{margin:20px 0 10px;font-size:18px}
.theory h3:first-child{margin-top:0}
.theory p{margin:0 0 12px}
.theory ul{margin:0 0 14px;padding-left:22px}
.theory li{margin-bottom:5px}
.theory code{
  background:#eef0f4;
  padding:2px 6px;
  border-radius:4px;
  font-family:'Consolas','Monaco',monospace;
  font-size:13.5px;
  color:#b8005c;
}
.theory pre{
  background:#1b1b32;
  color:#e6e6f0;
  padding:14px 18px;
  border-radius:10px;
  overflow-x:auto;
  font-size:13.5px;
  line-height:1.6;
  margin:0 0 16px;
}
.theory pre code{background:none;color:inherit;padding:0;font-size:13.5px}

.task{
  background:#fff8e1;
  border-left:5px solid var(--accent);
  border-radius:0 10px 10px 0;
  padding:16px 22px;
  margin:20px 0;
  font-size:15px;
  line-height:1.65;
}
.task b{display:block;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:#a07a00;margin-bottom:6px}

/* ---------- EDITOR ---------- */
.editor-box{
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
  border:1px solid #d5d8de;
  background:#1e1e2e;
}
.editor-head{
  display:flex;
  align-items:center;
  gap:8px;
  background:#181825;
  color:#a6adc8;
  padding:9px 16px;
  font-size:12.5px;
  font-family:'Consolas',monospace;
  border-bottom:1px solid #2a2a3d;
}
.dot{width:11px;height:11px;border-radius:50%}
.editor-head .sp{margin-left:auto;color:#585b70;font-size:11.5px}

.CodeMirror{
  height:auto !important;
  font-family:'Consolas','Monaco','Courier New',monospace !important;
  font-size:14px !important;
  line-height:1.6 !important;
  background:#1e1e2e !important;
  color:#cdd6f4 !important;
  padding:10px 0;
}
.CodeMirror-gutters{background:#181825 !important;border:none !important}
.CodeMirror-linenumber{color:#4c4f69 !important}
.CodeMirror-cursor{border-left:2px solid var(--accent) !important}
.CodeMirror-selected{background:#313244 !important}
.CodeMirror-activeline-background{background:#232336 !important}
.cm-keyword{color:#cba6f7 !important}
.cm-string{color:#a6e3a1 !important}
.cm-number{color:#fab387 !important}
.cm-comment{color:#6c7086 !important;font-style:italic}
.cm-def{color:#89b4fa !important}
.cm-builtin{color:#f9e2af !important}
.cm-operator{color:#94e2d5 !important}
.cm-variable{color:#cdd6f4 !important}
.cm-punctuation{color:#9399b2 !important}

/* ---------- ACTIONS ---------- */
.actions{display:flex;gap:12px;margin:20px 0 18px;flex-wrap:wrap}
.btn{
  border:none;
  border-radius:9px;
  padding:12px 22px;
  font-size:14.5px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover:not(:disabled){background:#166138}
.btn-ghost{background:#e3e5ea;color:#333}
.btn-ghost:hover{background:#d3d6dd}
.btn-warn{background:#fff;color:#c0392b;border:1.5px solid #f0c4bf}
.btn-warn:hover{background:#fdf1f0}

/* ---------- OUTPUT ---------- */
.output{margin-top:6px}
.panel{
  border-radius:12px;
  padding:16px 20px;
  margin-bottom:12px;
  font-size:14px;
  line-height:1.6;
  animation:fade .25s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.panel-title{font-weight:800;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.console{background:#11111b;color:#cdd6f4;border-radius:12px}
.console .panel-title{color:#7f849c}
.console pre{margin:0;font-family:'Consolas',monospace;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.ok{background:#e8f8ef;border-left:5px solid var(--green-l);color:#14532d}
.err{background:#fdeceb;border-left:5px solid var(--red);color:#7f1d1d}
.err pre{margin:8px 0 0;font-family:'Consolas',monospace;font-size:13px;white-space:pre-wrap}
.info{background:#eef4ff;border-left:5px solid #3b82f6;color:#1e3a8a}

/* ---------- MODAL ---------- */
.modal-bg{
  position:fixed;inset:0;background:rgba(15,15,25,.6);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-bg.show{display:flex}
.modal{
  background:#fff;border-radius:14px;max-width:720px;width:100%;
  max-height:80vh;overflow:auto;padding:26px 30px;
}
.modal h3{margin:0 0 6px;font-size:19px}
.modal p{margin:0 0 16px;color:#666;font-size:14px}
.modal pre{background:#1b1b32;color:#e6e6f0;padding:16px 20px;border-radius:10px;font-size:13.5px;overflow:auto;font-family:'Consolas',monospace;line-height:1.6}
.modal-close{float:right;border:none;background:#eee;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:700}

/* ---------- LOADER ---------- */
#loader{
  position:fixed;inset:0;background:rgba(27,27,50,.92);z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;gap:18px;
}
#loader.hide{display:none}
.spinner{
  width:54px;height:54px;border:5px solid #3b3b58;border-top-color:var(--accent);
  border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{margin:0;font-size:15px;color:#c9c9d9}

@media(max-width:900px){
  #burger{display:block}
  nav{position:fixed;left:0;top:60px;bottom:0;z-index:60;transform:translateX(-100%);transition:.25s}
  nav.open{transform:none;box-shadow:6px 0 24px rgba(0,0,0,.35)}
  main{padding:22px 18px 90px}
  .header-progress{max-width:160px}
  h1.title{font-size:23px}
}
</style>
</head>
<body>

<header>
  <button id="burger">☰</button>
  <div class="logo"><span class="py">Py</span>Camp</div>
  <div class="header-progress">
    <div class="pbar"><div id="pbarFill"></div></div>
    <span class="progress-label" id="progressLabel">0 / 0</span>
  </div>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main">
    <div class="wrap">
      <div class="crumb" id="crumb"></div>
      <h1 class="title" id="lessonTitle"></h1>
      <div class="theory" id="theory"></div>
      <div class="task" id="task"></div>

      <div class="editor-box">
        <div class="editor-head">
          <span class="dot" style="background:#ff5f57"></span>
          <span class="dot" style="background:#febc2e"></span>
          <span class="dot" style="background:#28c840"></span>
          <span style="margin-left:10px">main.py</span>
          <span class="sp">Ctrl + Enter — запустить</span>
        </div>
        <textarea id="code"></textarea>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="runBtn">▶ Запустить и проверить</button>
        <button class="btn btn-ghost" id="solutionBtn">💡 Показать решение</button>
        <button class="btn btn-warn" id="resetBtn">↺ Сбросить код</button>
        <button class="btn btn-primary" id="nextBtn" style="display:none">Следующий урок →</button>
      </div>

      <div class="output" id="output"></div>
    </div>
  </main>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">Закрыть</button>
    <h3 id="modalTitle">Решение</h3>
    <p>Попробуй разобраться сам, прежде чем подглядывать 🙂</p>
    <pre id="modalCode"></pre>
  </div>
</div>

<div id="loader" class="hide">
  <div class="spinner"></div>
  <p id="loaderText">Загружаем Python…</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
/* =======================================================================
   КУРРИКУЛУМ
   ======================================================================= */
const CURRICULUM = [

/* ===================== МОДУЛЬ 1 ===================== */
{
  title: "1. Первые шаги",
  lessons: [
  {
    id:"m1l1", title:"Команда print()",
    theory:`<p><code>print()</code> — самая первая команда, которую изучают в Python. Она выводит значение на экран.</p>
<pre><code>print("Привет, мир!")</code></pre>
<p>Текст в кавычках называется <b>строкой</b> (тип <code>str</code>). Кавычки могут быть одинарными или двойными — разницы нет:</p>
<pre><code>print('Одинарные тоже работают')</code></pre>
<p>Каждый вызов <code>print()</code> выводит текст с новой строки.</p>`,
    task:`Выведи на экран фразу <code>Привет, мир!</code>`,
    starter:`# Напиши свой код ниже\n`,
    tests:`assert "Привет, мир!" in _output, "На экране нет текста «Привет, мир!». Не забудь кавычки внутри print()."\nprint("✓ Тест пройден")`,
    solution:`print("Привет, мир!")`
  },
  {
    id:"m1l2", title:"Комментарии",
    theory:`<p><b>Комментарий</b> — это текст, который Python полностью игнорирует. Он начинается с символа <code>#</code> и нужен, чтобы объяснять код людям.</p>
<pre><code># Это комментарий, он не выполняется
print("Код работает")   # а это — комментарий в конце строки</code></pre>
<p>Хороший код читается легче, когда в нём есть короткие пояснения.</p>`,
    task:`Выведи две строки: <code>Python</code> и <code>рулит</code> (каждое слово — на своей строке). Добавь в код хотя бы один комментарий.`,
    starter:`# Добавь комментарий здесь\n`,
    tests:`lines = [l.strip() for l in _output.strip().split("\\n")]\nassert "Python" in lines, "Выведи слово Python"\nassert "рулит" in lines, "Выведи слово рулит на отдельной строке"\nassert any(l.strip().startswith("#") for l in _code.split("\\n")), "Добавь комментарий, начинающийся с #"\nprint("✓ Тест пройден")`,
    solution:`# Мой второй урок\nprint("Python")\nprint("рулит")`
  },
  {
    id:"m1l3", title:"Ошибки в коде",
    theory:`<p>Python не запускает программу, если в ней есть ошибка. Основные виды:</p>
<ul>
<li><code>SyntaxError</code> — нарушен синтаксис (например, забыта закрывающая скобка).</li>
<li><code>NameError</code> — используется имя, которого не существует.</li>
<li><code>IndentationError</code> — неправильные отступы.</li>
<li><code>TypeError</code> — операция применяется к неподходящему типу.</li>
</ul>
<p>Ошибка — это не провал, а подсказка: читай последнюю строку сообщения, там указана причина.</p>`,
    task:`Код ниже не работает. Исправь его, чтобы на экране появилось <code>Работает!</code>`,
    starter:`print("Работает!"\n`,
    tests:`assert "Работает!" in _output, "Пока не получается. Проверь, все ли скобки закрыты."\nprint("✓ Тест пройден")`,
    solution:`print("Работает!")`
  },
  {
    id:"m1l4", title:"Переменные",
    theory:`<p><b>Переменная</b> — это имя, за которым хранится значение. Знак <code>=</code> — это оператор присваивания, а не «равно».</p>
<pre><code>city = "Москва"
age = 25
print(city)</code></pre>
<p>Правила для имён: буквы, цифры и <code>_</code>; не могут начинаться с цифры; регистр важен (<code>Name</code> и <code>name</code> — разные переменные).</p>`,
    task:`Создай переменную <code>city</code> со значением <code>"Москва"</code> и выведи её через <code>print()</code>.`,
    starter:`# создай переменную city\n`,
    tests:`assert city == "Москва", "Переменная city должна содержать строку Москва"\nassert "Москва" in _output, "Выведи значение переменной city через print()"\nprint("✓ Тест пройден")`,
    solution:`city = "Москва"\nprint(city)`
  }]
},

/* ===================== МОДУЛЬ 2 ===================== */
{
  title: "2. Типы данных",
  lessons: [
  {
    id:"m2l1", title:"Числа: int и float",
    theory:`<p>В Python два основных числовых типа:</p>
<ul>
<li><code>int</code> — целые числа: <code>7</code>, <code>-3</code>, <code>1000000</code></li>
<li><code>float</code> — дробные: <code>3.14</code>, <code>-0.5</code>, <code>2.0</code></li>
</ul>
<p>Операторы: <code>+</code> <code>-</code> <code>*</code> <code>/</code> (обычное деление), <code>//</code> (целочисленное), <code>%</code> (остаток), <code>**</code> (степень).</p>
<pre><code>print(7 / 2)    # 3.5
print(7 // 2)   # 3
print(7 % 2)    # 1
print(2 ** 10)  # 1024</code></pre>`,
    task:`Создай переменные <code>a = 7</code> и <code>b = 2</code>, затем переменную <code>result</code>, равную <b>целочисленному</b> делению <code>a</code> на <code>b</code>. Выведи <code>result</code>.`,
    starter:`a = 7\nb = 2\n# посчитай result\n`,
    tests:`assert a == 7 and b == 2, "a должно быть 7, b должно быть 2"\nassert result == 3, "result должно быть результатом целочисленного деления 7 на 2"\nassert "3" in _output, "Выведи значение result"\nprint("✓ Тест пройден")`,
    solution:`a = 7\nb = 2\nresult = a // b\nprint(result)`
  },
  {
    id:"m2l2", title:"Строки",
    theory:`<p>Строка — это последовательность символов. Строки можно складывать (конкатенация) и умножать на число:</p>
<pre><code>a = "Py"
b = "thon"
print(a + b)     # Python
print("ха" * 3)  # хахаха
print(len(a + b))  # 6</code></pre>
<p><code>len()</code> возвращает длину строки.</p>`,
    task:`Создай <code>first = "Py"</code> и <code>second = "thon"</code>. Переменная <code>word</code> должна быть их конкатенацией. Выведи <code>word</code> и его длину.`,
    starter:`first = "Py"\nsecond = "thon"\n# создай word\n`,
    tests:`assert word == "Python", "word должно получиться строкой Python"\nassert "Python" in _output, "Выведи значение word"\nassert "6" in _output, "Выведи длину слова через len()"\nprint("✓ Тест пройден")`,
    solution:`first = "Py"\nsecond = "thon"\nword = first + second\nprint(word)\nprint(len(word))`
  },
  {
    id:"m2l3", title:"f-строки",
    theory:`<p><b>f-строка</b> — самый удобный способ вставить значения в текст. Перед кавычками ставится буква <code>f</code>, а внутри — фигурные скобки с выражениями.</p>
<pre><code>name = "Аня"
age = 25
print(f"{name} — {age} лет")</code></pre>
<p>Внутри <code>{}</code> можно писать любые выражения: <code>f"{age * 2}"</code>, <code>f"{name.upper()}"</code>.</p>`,
    task:`Даны <code>name = "Аня"</code> и <code>age = 25</code>. Создай переменную <code>info</code>, равную строке <code>Аня, 25 лет</code> — обязательно с помощью f-строки.`,
    starter:`name = "Аня"\nage = 25\n# создай info с помощью f-строки\n`,
    tests:`assert info == "Аня, 25 лет", "info должно быть строкой 'Аня, 25 лет'. Используй f-строку."\nprint("✓ Тест пройден")`,
    solution:`name = "Аня"\nage = 25\ninfo = f"{name}, {age} лет"\nprint(info)`
  },
  {
    id:"m2l4", title:"Логический тип и None",
    theory:`<p><code>bool</code> имеет всего два значения: <code>True</code> и <code>False</code> (с большой буквы).</p>
<p><code>None</code> — специальное значение «ничего», «пусто». Оно нужно, когда результата ещё нет.</p>
<pre><code>is_ready = True
result = None
print(type(is_ready))  # &lt;class 'bool'&gt;
print(type(result))    # &lt;class 'NoneType'&gt;</code></pre>

/* ===================== МОДУЛЬ 7 ===================== */
{
  title: "7. Функции",
  lessons: [
  {
    id:"m7l1", title:"def и return",
    theory:`<p><b>Функция</b> — именованный блок кода, который можно вызывать многократно.</p>
<pre><code>def add(a, b):
    return a + b

result = add(2, 3)
print(result)  # 5</code></pre>
<p><code>return</code> возвращает значение и сразу завершает функцию. Без <code>return</code> функция вернёт <code>None</code>.</p>`,
    task:`Напиши функцию <code>add(a, b)</code>, которая возвращает сумму двух чисел. Вызови её с аргументами 2 и 3 и сохрани результат в переменную <code>result</code>.`,
    starter:`# определи функцию add\n`,
    tests:`assert callable(add), "add должна быть функцией"\nassert add(2, 3) == 5, "add(2, 3) должна вернуть 5"\nassert add(-1, 1) == 0, "add(-1, 1) должна вернуть 0"\nassert add(10, 0) == 10, "add(10, 0) должна вернуть 10"\nassert result == 5, "result должен быть результатом add(2, 3)"\nprint("✓ Тест пройден")`,
    solution:`def add(a, b):\n    return a + b\n\nresult = add(2, 3)\nprint(result)`
  },
  {
    id:"m7l2", title:"Параметры и аргументы",
    theory:`<p>Функция может принимать любое число параметров. Аргументы можно передавать по позиции или по имени:</p>
<pre><code>def rect_area(width, height):
    return width * height

rect_area(3, 4)              # позиционно
rect_area(height=4, width=3) # по имени</code></pre>`,
    task:`Напиши две функции:<br>
<code>area(width, height)</code> — возвращает площадь прямоугольника,<br>
<code>perimeter(width, height)</code> — возвращает периметр.`,
    starter:`# определи функции\n`,
    tests:`assert area(3, 4) == 12, "area(3, 4) должна вернуть 12"\nassert area(5, 5) == 25, "area(5, 5) должна вернуть 25"\nassert perimeter(3, 4) == 14, "perimeter(3, 4) должна вернуть 14"\nassert perimeter(5, 5) == 20, "perimeter(5, 5) должна вернуть 20"\nprint("✓ Тест пройден")`,
    solution:`def area(width, height):\n    return width * height\n\ndef perimeter(width, height):\n    return 2 * (width + height)`
  },

    id:"m7l3", title:"Значения по умолчанию",
    theory:`<p>Параметру можно задать значение по умолчанию — тогда аргумент можно не передавать.</p>
<pre><code>def greet(name, greeting="Привет"):
    return f"{greeting}, {name}!"

greet("Аня")                  # Привет, Аня!
greet("Аня", "Здравствуйте")  # Здравствуйте, Аня!</code></pre>
<p>Параметры со значением по умолчанию должны идти <b>после</b> обычных.</p>`,
    task:`Напиши функцию <code>greet(name, greeting="Привет")</code>, возвращающую строку вида <code>Привет, Аня!</code>.`,
    starter:`# определи функцию greet\n`,
    tests:`assert greet("Аня") == "Привет, Аня!", "greet('Аня') должна вернуть 'Привет, Аня!'"\nassert greet("Аня", "Здравствуйте") == "Здравствуйте, Аня!", "С кастомным приветствием должно работать иначе"\nprint("✓ Тест пройден")`,
    solution:`def greet(name, greeting="Привет"):\n    return f"{greeting}, {name}!"`
  },
  {
    id:"m7l4", title:"*args и **kwargs",
    theory:`<p><code>*args</code> собирает позиционные аргументы в кортеж, <code>**kwargs</code> — именованные в словарь.</p>
<pre><code>def total(*args):
    return sum(args)

total(1, 2, 3)   # 6

def info(**kwargs):
    return ", ".join(f"{k}={v}" for k, v in kwargs.items())

info(name="Аня", age=25)  # 'name=Аня, age=25'</code></pre>`,
    task:`Напиши функцию <code>total(*args)</code>, возвращающую сумму всех переданных чисел (используй <code>sum()</code>). И функцию <code>keys(**kwargs)</code>, возвращающую список имён переданных параметров.`,
    starter:`# определи функции total и keys\n`,
    tests:`assert total() == 0, "total() без аргументов должна вернуть 0"\nassert total(1, 2, 3) == 6, "total(1,2,3) должна вернуть 6"\nassert total(10) == 10, "total(10) должна вернуть 10"\nassert keys(a=1, b=2) == ["a", "b"], "keys(a=1, b=2) должна вернуть ['a', 'b']"\nprint("✓ Тест пройден")`,
    solution:`def total(*args):\n    return sum(args)\n\ndef keys(**kwargs):\n    return list(kwargs.keys())`
  },
  {
    id:"m7l5", title:"lambda и области видимости",
    theory:`<p><b>lambda</b> — короткая анонимная функция из одного выражения.</p>
<pre><code>double = lambda x: x * 2
double(5)   # 10

sorted(["ccc","a","bb"], key=lambda w: len(w))
# ['a', 'bb', 'ccc']</code></pre>
<p><b>Область видимости:</b> переменные, созданные внутри функции, снаружи не видны (локальные). Глобальные переменные читать можно, но изменять — только с <code>global</code>.</p>`,
    task:`Создай <code>double = lambda x: x * 2</code> и <code>square = lambda x: x ** 2</code>. Затем отсортируй список <code>words</code> по длине слова в переменную <code>sorted_words</code>.`,
    starter:`words = ["банан", "я", "апельсин", "кот"]\n`,
    tests:`assert double(5) == 10, "double(5) должно быть 10"\nassert square(4) == 16, "square(4) должно быть 16"\nassert sorted_words == ["я", "кот", "банан", "апельсин"], "Отсортируй слова по длине"\nprint("✓ Тест пройден")`,
    solution:`words = ["банан", "я", "апельсин", "кот"]\ndouble = lambda x: x * 2\nsquare = lambda x: x ** 2\nsorted_words = sorted(words, key=lambda w: len(w))`
  }]
},

    solution:`class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return "..."\n\nclass Cat(Animal):\n    def speak(self):\n        return "Мяу"\n\nclass Dog(Animal):\n    def speak(self):\n        return "Гав"`

    id:"m8l5", title:"Магические методы",
    theory:`<p><b>Магические методы</b> (dunder) позволяют объектам вести себя как встроенные типы.</p>
<ul>
<li><code>__str__</code> — что вернёт <code>str(obj)</code> и <code>print(obj)</code></li>
<li><code>__repr__</code> — отладочное представление</li>
<li><code>__eq__</code> — сравнение через <code>==</code></li>
<li><code>__len__</code> — работает с <code>len()</code></li>
</ul>
<pre><code>class Point:
    def __init__(self, x, y):
        self.x, self.y = x, y
    def __str__(self):
        return f"({self.x}, {self.y})"

    task:`Создай класс <code>Money</code> с атрибутами <code>amount</code> и <code>currency</code>. Реализуй <code>__str__</code> (возвращает <code>f"{amount} {currency}"</code>) и <code>__eq__</code> (равны, если совпадают и сумма, и валюта).`,
    starter:`class Money:\n    def __init__(self, amount, currency):\n        self.amount = amount\n        self.currency = currency\n\n    # добавь __str__ и __eq__\n`,
    tests:`m = Money(100, "RUB")\nassert str(m) == "100 RUB", "str(Money(100,'RUB')) должно быть '100 RUB'"\nassert Money(100, "RUB") == Money(100, "RUB"), "Одинаковые деньги должны быть равны"\nassert Money(100, "RUB") != Money(100, "USD"), "Разные валюты — не равны"\nassert Money(50, "RUB") != Money(100, "RUB"), "Разные суммы — не равны"\nprint("✓ Тест пройден")`,
    solution:`class Money:\n    def __init__(self, amount, currency):\n        self.amount = amount\n        self.currency = currency\n\n    def __str__(self):\n        return f"{self.amount} {self.currency}"\n\n    def __eq__(self, other):\n        return self.amount == other.amount and self.currency == other.currency`
