const PY_KEYWORDS = new Set(('and as assert async await break class continue def del elif else except finally for from global if import in is lambda None not or pass raise return try while with yield match case True False nonlocal').split(' '));
const PY_BUILTINS = new Set('print len range int float str bool list dict set tuple sum min max abs round sorted reversed enumerate zip map filter open input type isinstance super property staticmethod classmethod id hash repr format iter next any all slice divmod pow chr ord vars getattr setattr hasattr Exception ValueError TypeError KeyError IndexError ZeroDivisionError AttributeError NameError FileExistsError OSError StopIteration ArithmeticError object bytes bytearray complex frozenset dataclass field Counter defaultdict namedtuple product combinations permutations'.split(' '));

function hlPython(src){
  const re = /(#[^\n]*)|("""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$))|([rRbBuUfF]{0,2}"(?:\\.|[^"\\\n])*"?|[rRbBuUfF]{0,2}'(?:\\.|[^'\\\n])*'?)|(\b\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?\b|\b0[xXbBoO][0-9a-fA-F_]+\b)|(@[A-Za-z_][\w.]*)|([A-Za-z_]\w*)|([^\sA-Za-z_#"'@]+)|(\s+)/g;
  let out = '', m;
  while((m = re.exec(src)) !== null){
    if(m[1]) out += `<span class="tok-com">${esc(m[1])}</span>`;
    else if(m[2] || m[3]) out += `<span class="tok-str">${esc(m[2] || m[3])}</span>`;
    else if(m[4]) out += `<span class="tok-num">${esc(m[4])}</span>`;
    else if(m[5]) out += `<span class="tok-dec">${esc(m[5])}</span>`;
    else if(m[6]){
      const w = m[6];
      if(PY_KEYWORDS.has(w)) out += `<span class="tok-kw">${w}</span>`;
      else if(w === 'self' || w === 'cls') out += `<span class="tok-self">${w}</span>`;
      else if(/^\s*\(/.test(src.slice(re.lastIndex))) out += `<span class="tok-fn">${w}</span>`;
      else if(PY_BUILTINS.has(w)) out += `<span class="tok-bi">${w}</span>`;
      else out += esc(w);
    }
    else if(m[7]) out += `<span class="tok-op">${esc(m[7])}</span>`;
    else out += m[8];
  }
  return out + '\n';
}

/* ------------------------ мини-Markdown -------------------------------- */
function md(text){
  if(!text) return '';
  const blocks = [];
  const stash = html => { blocks.push(html); return `\u0000${blocks.length-1}\u0000`; };

  // 1) специальные блоки (внутри них может быть свой код — обрабатываем рекурсивно)
  let src = String(text).replace(/:::(task|note|tip)\r?\n([\s\S]*?)\r?\n?:::/g, (a, kind, body)=>{
    const title = kind === 'task' ? '🎯 Задание' : (kind === 'tip' ? '💡 Совет' : '📌 Заметка');
    return stash(`<div class="${kind === 'task' ? 'task' : 'note'}"><div class="t-h">${title}</div>${md(body)}</div>`);
  });

  // 2) блоки кода: ~~~python ... ~~~  (или ``` ... ```)
  src = src.replace(/(?:~~~|```)(\w*)\r?\n([\s\S]*?)(?:~~~|```)/g,
    (a, lang, code) => stash(`<pre><code>${hlPython(code.replace(/\s+$/,''))}</code></pre>`));

  src = esc(src);
  const lines = src.split('\n');
  let html = '', listType = null, para = [];
  const flushPara = ()=>{ if(para.length){ html += `<p>${para.join(' ')}</p>`; para = []; } };
  const closeList = ()=>{ if(listType){ html += `</${listType}>`; listType = null; } };
  const inline = s => s
    .replace(/`([^`]+)`/g, (a,c)=>`\u0001${c}\u0001`)
    .replace(/\[\[([^\[\]]+)\]\]/g, (a,c)=>`\u0001${c}\u0001`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\u0001([^\u0001]+)\u0001/g, (a,c)=>`<code>${c}</code>`);

  let skipTo = -1;
  for(let li = 0; li < lines.length; li++){
    const raw = lines[li];
    if(li < skipTo) continue;
    const line = raw.replace(/\s+$/,'');
    const trimmed = line.trim();
    if(/^\u0000\d+\u0000$/.test(trimmed)){ flushPara(); closeList(); html += trimmed; continue; }
    if(!trimmed){ flushPara(); closeList(); continue; }
    let m;
    if((m = trimmed.match(/^(#{2,4})\s+(.*)$/))){
      flushPara(); closeList();
      const lvl = Math.min(6, m[1].length + 1);
      html += `<h${lvl}>${inline(m[2])}</h${lvl}>`; continue;
    }
    if((m = line.match(/^\s*[-*]\s+(.*)$/))){
      flushPara();
      if(listType !== 'ul'){ closeList(); html += '<ul>'; listType = 'ul'; }
      html += `<li>${inline(m[1])}</li>`; continue;
    }
    if((m = line.match(/^\s*\d+[.)]\s+(.*)$/))){
      flushPara();
      if(listType !== 'ol'){ closeList(); html += '<ol>'; listType = 'ol'; }
      html += `<li>${inline(m[1])}</li>`; continue;
    }
    if(/^\|.*\|$/.test(trimmed)){
      flushPara(); closeList();
      const rows = [trimmed];
      let j = li + 1;
      while(j < lines.length && /^\|.*\|$/.test(lines[j].trim())){ rows.push(lines[j].trim()); j++; }
      const splitRow = r => r.slice(1, -1).split('|').map(c=>c.trim());
      const head = splitRow(rows[0]);
      const body = rows.slice(2).map(splitRow);
      html += '<table><thead><tr>' + head.map(h=>`<th>${inline(h)}</th>`).join('') + '</tr></thead><tbody>' +
              body.map(r=>'<tr>' + r.map(c=>`<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
      skipTo = j;
      continue;
    }
    if((m = trimmed.match(/^&gt;\s?(.*)$/))){ flushPara(); closeList(); html += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    para.push(inline(trimmed));
  }
  flushPara(); closeList();
  html = html.replace(/\u0000(\d+)\u0000/g, (a,i)=>blocks[+i]).replace(/\u0001/g,'');
  return html;
}

/* инлайн-форматирование коротких строк (вопросы квизов, объяснения) */
function mdInline(s){
  return esc(String(s))
    .replace(/`([^`]+)`/g, (a,c)=>`<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

/* ---------------------- среда выполнения Python ------------------------- */
const PYODIDE_VERSIONS = ['0.26.4','0.27.7','0.25.1'];
let pyodide = null, pyStatus = 'idle', pyStatusText = 'Среда Python ещё не загружена', pyPromise = null;

function injectScript(url){
  return new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = url; s.async = true;
    s.onload = ()=>res(); s.onerror = ()=>rej(new Error('не загрузился '+url));
    document.head.appendChild(s);
  });
}

async function ensurePyodide(){
  if(pyodide) return pyodide;
  if(pyPromise) return pyPromise;
  pyStatus = 'loading'; pyStatusText = 'Загружаем Python…'; updateRuntimeBtn(); showRuntimeBanner();
  pyPromise = (async ()=>{
    for(const v of PYODIDE_VERSIONS){
      const url = `https://cdn.jsdelivr.net/pyodide/v${v}/full/pyodide.js`;
      try{
        await injectScript(url);
        if(typeof window.loadPyodide !== 'function') throw new Error('loadPyodide не найден');
        const py = await window.loadPyodide({indexURL: url.slice(0, url.lastIndexOf('/')+1)});
        py.runPython(RUNNER_SRC);
        try{ py.setStdout({batched: s => appendRawOutput(s)}); }catch(e){}
        try{ py.setStderr({batched: s => appendRawOutput(s, true)}); }catch(e){}
        pyodide = py;
        let ver = '3.x'; try{ ver = py.runPython('import sys; sys.version.split()[0]'); }catch(e){}
        pyStatus = 'ready'; pyStatusText = `Python ${ver} готов к работе`;
        updateRuntimeBtn(); onRuntimeReady();
        return py;
      }catch(e){
        console.warn('[PyCamp] Pyodide fallback', v, e && e.message);
        try{ delete window.loadPyodide; }catch(_){}
      }
    }
    pyStatus = 'error'; pyStatusText = 'Не удалось загрузить Python (нужен доступ к CDN jsdelivr.net)';
    pyPromise = null;
    updateRuntimeBtn(); onRuntimeReady();
    throw new Error(pyStatusText);
  })();
  return pyPromise;
}

function updateRuntimeBtn(){
  const b = $('#runtimeBtn'); if(!b) return;
  b.textContent = pyStatus === 'ready' ? '🟢' : ((pyStatus === 'loading' || pyStatus === 'idle') ? '⏳' : '🔴');
  b.title = pyStatusText + (pyStatus === 'ready' ? '' : ' — нажмите, чтобы загрузить/повторить');
}
function onRuntimeReady(){
  if(pyStatus === 'ready'){ const b = $('#runtimeBanner'); if(b) b.remove(); }
  $$('[data-need-runtime]').forEach(x => x.disabled = (pyStatus !== 'ready'));
}

const RUNNER_SRC = `
import sys, io, json, contextlib, traceback, builtins

class _StepLimit(Exception):
    pass

def _format_err(tb):
    res = []
    for line in tb.strip().splitlines():
        s = line.strip()
        if s.startswith('File "'):
            if ('main.py' in s) or ('<test>' in s):
                n = s.split('line ')[1].split(',')[0] if 'line ' in s else '?'
                res.append('строка ' + n)
        elif s.startswith('Traceback'):
            continue
        else:
            res.append(s)
    return chr(10).join(res[-4:])

def _run_all(user_code, tests, run_stdin):
    res = {"output": "", "error": None, "tests": [], "steps": 0}
    counter = [0]

    def tracer(frame, event, arg):
        counter[0] += 1
        if counter[0] > 1500000:
            raise _StepLimit("Превышен лимит выполнения: очень похоже на бесконечный цикл. Программа остановлена.")
        return tracer

    def exec_capture(code, gl, inp, label):
        buf = io.StringIO()
        vals = list(inp or [])
        pos = [0]
        def fake_input(prompt=""):
            if prompt:
                buf.write(str(prompt))
            if pos[0] < len(vals):
                v = str(vals[pos[0]]); pos[0] += 1
                buf.write(v + chr(10))
                return v
            raise EOFError("ввод закончился: для input() не хватило данных")
        old_input = builtins.input
        builtins.input = fake_input
        sys.settrace(tracer)
        err = None
        try:
            with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(buf):
                exec(compile(code, label, "exec"), gl)
        except _StepLimit as e:
            err = str(e)
        except SystemExit:
            pass
        except BaseException:
            err = _format_err(traceback.format_exc())
        finally:
            sys.settrace(None)
            builtins.input = old_input
        return buf.getvalue(), err

    base = {"__name__": "__main__", "__builtins__": builtins, "__doc__": None, "__file__": "main.py", "_source": user_code}
    out, err = exec_capture(user_code, base, run_stdin, "main.py")
    res["output"] = out
    res["error"] = err

    for t in tests or []:
        tg = dict(base)
        tg["__name__"] = "__test__"
        name = t.get("name") or "Проверка"
        if t.get("run"):
            o, e = exec_capture(user_code, tg, t.get("stdin"), "main.py")
            if not e and t.get("code"):
                tg["_out"] = o
                tg["_lines"] = o.splitlines()
                o2, e2 = exec_capture(t.get("code"), tg, None, "<test>")
                if e2:
                    e = e2
        elif t.get("code"):
            o, e = exec_capture(t.get("code") or "", tg, t.get("stdin"), "<test>")
        if e:
            res["tests"].append({"pass": False, "name": name, "detail": e, "output": o})
            continue
        ok = True
        detail = ""
        for c in (t.get("srcContains") or []):
            if str(c) not in user_code:
                ok = False
                detail = "В исходном коде ожидалось: " + repr(str(c))
                break
        for c in (t.get("srcNotContains") or []):
            if ok and str(c) in user_code:
                ok = False
                detail = "В коде не должно быть: " + repr(str(c))
                break
        for c in (t.get("notContains") or []):
            if ok and str(c) in o:
                ok = False
                detail = "В выводе не должно быть: " + repr(str(c))
        for c in (t.get("contains") or []):
            if not ok:
                break
            if str(c) not in o:
                ok = False
                detail = "В выводе ожидалось: " + repr(str(c)) + chr(10) + "Получено: " + (o.strip() or "(пусто)")
                break
        if ok and (t.get("outputEquals") is not None):
            if o.strip() != str(t.get("outputEquals")).strip():
                ok = False
                detail = "Ожидался вывод: " + repr(str(t.get("outputEquals"))) + chr(10) + "Получено: " + repr(o.strip())
        res["tests"].append({"pass": ok, "name": name, "detail": detail, "output": o})
    res["steps"] = counter[0]
    return json.dumps(res)
`;

let running = false;
async function runPython(code, tests, stdin){
  const py = await ensurePyodide();
  if(running) throw new Error('Предыдущий запуск ещё не завершился');
  running = true;
  try{
    // данные передаём как JSON — это надёжнее и не оставляет pyodide-прокси
    py.globals.set('_user_code', code);
    py.globals.set('_tests_json', JSON.stringify(tests || []));
    py.globals.set('_stdin_json', JSON.stringify(stdin || []));
    const json = py.runPython('_run_all(_user_code, json.loads(_tests_json), json.loads(_stdin_json))');
    return JSON.parse(json);
  } finally { running = false; }
}

/* ------------------------- индекс курса -------------------------------- */
let LESSONS = [], TOTAL_XP = 0;
function indexCourse(){
  LESSONS = [];
  COURSE.forEach(m => m.lessons.forEach(l => { l._module = m; LESSONS.push(l); }));
  LESSONS.forEach((l,i)=> l._index = i);
  TOTAL_XP = LESSONS.reduce((s,l)=>s+(l.xp||20),0);
}
const lessonById = id => LESSONS.find(l => l.id === id);
const doneCount = () => Object.keys(state.done).length;
const isDone = id => !!state.done[id];
const levelOf = xp => Math.floor(xp/250)+1;
function addXp(n){ state.xp += n; const e = $('#xpValue'); if(e) e.textContent = state.xp; }

/* ------------------------- сайдбар / прогресс -------------------------- */
function renderSidebar(filter=''){
  const f = (filter||'').trim().toLowerCase();
  const nav = $('#curriculum'); if(!nav) return;
  nav.innerHTML = COURSE.map(m=>{
    const list = m.lessons.filter(l => !f || (l.title + ' ' + m.title + ' ' + (l.desc||'')).toLowerCase().includes(f));
    if(!list.length) return '';
    const done = m.lessons.filter(l=>isDone(l.id)).length;
    const activeInside = list.some(l => l.id === state.lessonId);
    const open = f ? true : (activeInside ? true : state.openModules[m.id] !== false);
    return `<div class="module ${open?'open':''}">
      <button class="module-head" data-toggle-module="${m.id}">
        <span class="m-ico">${m.icon||'📘'}</span>
        <span style="flex:1">${esc(m.title)}</span>
        <span class="m-cnt">${done}/${m.lessons.length}</span>
        <span class="chev">▶</span>
      </button>
      <div class="lessons">
        ${list.map(l=>`<button class="lesson-link ${isDone(l.id)?'done':''} ${state.lessonId===l.id?'active':''}" data-lesson="${l.id}">
            <span class="tick">✔</span><span class="num">${l._index+1}</span><span>${esc(l.title)}</span>
          </button>`).join('')}
      </div>
    </div>`;
  }).join('') || `<p class="muted" style="padding:10px">Ничего не найдено</p>`;
  updateProgressUI();
  const act = $('.lesson-link.active');
  if(act) act.scrollIntoView({block:'nearest'});
}

function updateProgressUI(){
  const d = doneCount(), t = LESSONS.length, pct = t ? Math.round(d/t*100) : 0;
  const set = (id,v)=>{ const e = $(id); if(e) e.textContent = v; };
  set('#progText', `${d} / ${t}`);
  set('#progPct', `${pct}% пройдено`);
  set('#progXp', `${state.xp} XP`);
  set('#xpValue', state.xp);
  const bar = $('#progBar'); if(bar) bar.style.width = pct + '%';
}

/* ----------------------------- роутер ---------------------------------- */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  if(!h) return {view:'home'};
  const parts = h.split('/');
  if(parts[0] === 'lesson' && parts[1]) return {view:'lesson', lessonId:parts[1]};
  return {view:parts[0]};
}
function navigate(hash){ if(location.hash === hash) route(); else location.hash = hash; }

function route(){
  const r = parseHash();
  if(r.view === 'lesson' && !lessonById(r.lessonId)) r.view = 'home';
  state.view = r.view; state.lessonId = r.lessonId || null;
  document.onkeydown = null;
  $$('.tab').forEach(t=>{
    const v = t.dataset.view;
    t.classList.toggle('active', (v === 'course' && (r.view==='home' || r.view==='lesson')) || v === r.view);
  });
  window.scrollTo(0,0);
  if(r.view === 'lesson') renderLesson(lessonById(r.lessonId));
  else if(r.view === 'playground') renderPlayground();
  else if(r.view === 'cheatsheet') renderCheatsheet();
  else if(r.view === 'progress') renderProgress();
  else if(r.view === 'certificate') renderCertificate();
  else renderHome();
  renderSidebar($('#lessonSearch') ? $('#lessonSearch').value : '');
  $('#sidebar').classList.remove('open');
  const bd = $('.backdrop'); if(bd) bd.remove();
}

  const savedCode = state.code[l.id] !== undefined ? state.code[l.id] : (l.starter || '');

/* ----------------------------- редактор -------------------------------- */
function initEditor(l, value){
  const ta = $('#codeInput'), hl = $('#highlight'), gutter = $('#gutter');
  const sync = ()=>{
    const v = ta.value;
    hl.innerHTML = hlPython(v);
    hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft;
    gutter.innerHTML = Array.from({length:v.split('\n').length},(_,i)=>i+1).join('<br>');
    gutter.scrollTop = ta.scrollTop;
    state.code[l.id] = v;
  };
  ta.value = value === undefined ? '' : value;
  sync();
  let saveT;
  ta.addEventListener('input', ()=>{ sync(); clearTimeout(saveT); saveT = setTimeout(saveState, 600); });
  ta.addEventListener('scroll', ()=>{ hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; gutter.scrollTop = ta.scrollTop; });
  ta.addEventListener('keydown', e=>{
    const s = ta.selectionStart, en = ta.selectionEnd;
    if(e.key === 'Tab'){
      e.preventDefault();
      if(s !== en && ta.value.slice(s,en).includes('\n')){
        const from = ta.value.slice(0,s).lastIndexOf('\n')+1;
        const block = ta.value.slice(from,en);
        const shifted = e.shiftKey ? block.replace(/^ {1,4}/gm,'') : block.replace(/^/gm,'    ');
        ta.value = ta.value.slice(0,from) + shifted + ta.value.slice(en);
        ta.selectionStart = from; ta.selectionEnd = from + shifted.length;
      } else if(e.shiftKey){
        const from = ta.value.slice(0,s).lastIndexOf('\n')+1;
        if(ta.value.slice(from, from+4) === '    '){
          ta.value = ta.value.slice(0,from) + ta.value.slice(from+4);
          ta.selectionStart = ta.selectionEnd = Math.max(from, s-4);
        }
      } else {
        ta.value = ta.value.slice(0,s) + '    ' + ta.value.slice(en);
        ta.selectionStart = ta.selectionEnd = s + 4;
      }
      sync(); return;
    }
    if(e.key === 'Enter'){
      const from = ta.value.slice(0,s).lastIndexOf('\n')+1;
      const line = ta.value.slice(from, s);
      const indent = (line.match(/^[ \t]*/)||[''])[0];
      const extra = /:\s*(#.*)?$/.test(line) ? '    ' : '';
      if(indent || extra){
        e.preventDefault();
        const ins = '\n' + indent + extra;
        ta.value = ta.value.slice(0,s) + ins + ta.value.slice(en);
        ta.selectionStart = ta.selectionEnd = s + ins.length;
        sync();
      }
      return;
    }
    const pairs = {'"':'"', "'":"'", '(' :')', '[':']', '{':'}'};
    if(pairs[e.key] && s !== en){
      e.preventDefault();
      const sel = ta.value.slice(s,en);
      ta.value = ta.value.slice(0,s) + e.key + sel + pairs[e.key] + ta.value.slice(en);
      ta.selectionStart = s+1; ta.selectionEnd = en+1; sync();
    }
  });
  editorApi = {sync, getValue: ()=>ta.value, setValue: v=>{ ta.value = v; sync(); }, focus: ()=>ta.focus()};
  return editorApi;
}

function initQuiz(l){
  $$('.quiz-q').forEach(box=>{
    const qi = +box.dataset.q;
    $$('input', box).forEach(inp=>inp.addEventListener('change', ()=>{
      state.quiz[l.id] = state.quiz[l.id] || {};
      state.quiz[l.id][qi] = +inp.value;
      $$('.opt', box).forEach(o=>o.classList.remove('correct','wrong'));
      const ex = box.querySelector('[data-explain]'); if(ex) ex.classList.add('hidden');
      saveState();
    }));
  });
}
function checkQuiz(l){
  let ok = true;
  l.questions.forEach((q,qi)=>{
    const box = $(`.quiz-q[data-q="${qi}"]`); if(!box) return;
    const sel = (state.quiz[l.id]||{})[qi];
    $$('.opt', box).forEach((o,oi)=>{
      o.classList.remove('correct','wrong');
      if(oi === q.answer) o.classList.add('correct');
      else if(oi === sel) o.classList.add('wrong');
    });
    if(sel !== q.answer) ok = false;
    const ex = box.querySelector('[data-explain]');
    if(ex){ ex.classList.remove('hidden'); ex.innerHTML = (sel === q.answer ? '✅ Верно. ' : '❌ Неверно. ') + mdInline(q.explain||''); }
  });
  return ok;
}

function wireLessonButtons(l, hasTests){
  $('#runBtn')?.addEventListener('click', ()=>doRun(l));
  $('#checkBtn')?.addEventListener('click', ()=>doCheck(l));
  $('#resetBtn')?.addEventListener('click', ()=>{
    if(confirm('Вернуть исходный код урока? Твои правки в редакторе будут потеряны.')){
      editorApi.setValue(l.starter||''); state.code[l.id] = l.starter||''; saveState();
      setConsole('Код сброшен к исходному.', 'dim');
    }
  });
  $('#solutionBtn')?.addEventListener('click', ()=>{
    const sp = $$('details.spoiler');
    if(sp.length){ const el = sp[sp.length-1]; el.open = true; el.scrollIntoView({behavior:'smooth', block:'center'}); }
  });
  $('#checkQuizBtn')?.addEventListener('click', ()=>{
    checkQuiz(l) ? completeLesson(l) : toast('Есть ошибки в ответах — попробуй ещё раз');
  });
  $$('[data-ctab]').forEach(b=>b.addEventListener('click', ()=>{
    $$('[data-ctab]').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    $('#consoleOut')?.classList.toggle('hidden', b.dataset.ctab !== 'out');
    $('#consoleTests')?.classList.toggle('hidden', b.dataset.ctab !== 'tests');
  }));
  document.onkeydown = e=>{
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      if(!hasTests) return;
      e.shiftKey ? doCheck(l) : doRun(l);
      return;
    }
    if(e.altKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')){
      const target = LESSONS[l._index + (e.key === 'ArrowRight' ? 1 : -1)];
      if(target){ e.preventDefault(); navigate('#/lesson/' + target.id); }
    }
  };
  onRuntimeReady();
}

async function doRun(l){
  const code = editorApi ? editorApi.getValue() : (l.starter||'');
  state.code[l.id] = code; saveState();
  setConsole('⏳ Выполняю…', 'dim');
  try{
    const t0 = performance.now();
    const r = await runPython(code, [], l.stdin || []);
    const ms = Math.round(performance.now() - t0);
    let html = '';
    if(l.stdin && l.stdin.length) html += `<span class="dim">ввод: ${esc(l.stdin.join(' → '))}</span>\n`;
    if(r.output) html += esc(r.output);
    if(r.error) html += `<span class="err">${esc(r.error)}</span>\n`;
    if(!r.output && !r.error) html += `<span class="dim">(программа завершилась без вывода)</span>\n`;
    html += `<span class="dim">— готово за ${ms} мс —</span>`;
    $('#consoleOut').innerHTML = html;
  }catch(e){
    setConsole('Ошибка среды выполнения: ' + e.message + '\n\nPython исполняется через Pyodide с CDN — нужен доступ в интернет.', 'err');
  }
}

async function doCheck(l){
  const code = editorApi ? editorApi.getValue() : '';
  state.code[l.id] = code; saveState();
  const quizOk = (l.questions && l.questions.length) ? checkQuiz(l) : true;
  setConsole('⏳ Проверяю решение…', 'dim');
  try{
    const r = await runPython(code, l.tests || [], l.stdin || []);
    renderTests(r);
    const allPass = r.tests.length > 0 && r.tests.every(t=>t.pass);
    if(allPass && quizOk) completeLesson(l);
    else {
      document.querySelector('[data-ctab="tests"]')?.click();
      toast(quizOk ? 'Не все тесты пройдены — загляни во вкладку «Тесты»' : 'Поправь код и/или ответы на вопросы');
    }
  }catch(e){
    setConsole('Ошибка среды выполнения: ' + e.message, 'err');
  }
}

function renderTests(r){
  const el = $('#consoleTests'); if(!el) return;
  let html = '';
  if(r.error) html += `<div class="test-item fail"><span class="ico">💥</span><div><strong>Ошибка в программе</strong><div class="det">${esc(r.error)}</div></div></div>`;
  r.tests.forEach(t=>{
    const det = (t.detail||'').replace(/^AssertionError:\s*/,'');
    html += `<div class="test-item ${t.pass?'pass':'fail'}">
      <span class="ico">${t.pass?'✅':'❌'}</span>
      <div><strong>${esc(t.name)}</strong>
        ${det ? `<div class="det">${esc(det)}</div>` : ''}
        ${t.output && t.output.trim() ? `<details style="margin-top:5px"><summary class="muted" style="font-size:12px;cursor:pointer">показать вывод проверки</summary><div class="det">${esc(t.output)}</div></details>` : ''}
      </div></div>`;
  });
  if(!r.tests.length) html = `<div class="test-item fail"><span class="ico">⚠️</span><div>Для этого урока нет автотестов</div></div>`;
  el.innerHTML = html;
  const passed = r.tests.filter(t=>t.pass).length;
  const c = $('#testsCount'); if(c) c.textContent = r.tests.length ? `(${passed}/${r.tests.length})` : '';
  const out = $('#consoleOut');
  if(out) out.innerHTML = (r.output ? esc(r.output) : '<span class="dim">(нет вывода)</span>') + (r.error ? `<span class="err">${esc(r.error)}</span>` : '');
}

function completeLesson(l, manual){
  if(!l) return;
  const first = !isDone(l.id);
  state.done[l.id] = {ts: Date.now(), manual: !!manual};
  if(first) addXp(l.xp||20);
  saveState();
  confetti(first ? 80 : 20);
  toast(first ? `🎉 Урок пройден! +${l.xp||20} XP` : '✔ Отмечено как выполненное');

  if(badges && !$('.badge.done')) badges.insertAdjacentHTML('beforeend', '<span class="badge done">✔ Выполнено</span>');
  const nxt = $('.lesson-nav .btn.primary');
  if(nxt && first){ nxt.classList.add('pulse'); setTimeout(()=>nxt.classList.remove('pulse'), 4000); }
  if(doneCount() === LESSONS.length) setTimeout(()=>{ confetti(240); toast('🏆 Курс пройден полностью! Забери сертификат', 6000); }, 700);
}

    <div class="stat"><div class="v">${COURSE.filter(m=>m.lessons.every(l=>isDone(l.id))).length}/${COURSE.length}</div><div class="k">модулей закрыто полностью</div></div>
  </div>

  <h2 class="section-title">🧩 Разбивка по модулям</h2>
  ${COURSE.map(m=>{
    const done = m.lessons.filter(l=>isDone(l.id)).length, p = Math.round(done/m.lessons.length*100);
    return `<div class="mod-card" style="margin-bottom:12px">
      <div class="row" style="justify-content:space-between">
        <h3 style="margin:0">${m.icon||'📘'} ${esc(m.title)}</h3>
        <span class="muted" style="font-size:13px">${done}/${m.lessons.length} · ${p}%</span>
      </div>
      <div class="bar" style="margin-top:10px"><i style="width:${p}%"></i></div>
      <div class="row mt" style="gap:6px">
        ${m.lessons.map(l=>`<button class="btn small ${isDone(l.id)?'green':'ghost'}" data-goto-lesson="${l.id}">${isDone(l.id)?'✔':'○'} ${esc(short(l.title))}</button>`).join('')}
      </div>
    </div>`;
  }).join('')}

  <h2 class="section-title">⚙️ Данные</h2>
  <div class="card"><div class="card-body row">
    <button class="btn" id="exportBtn">⬇️ Экспорт прогресса</button>
    <button class="btn" id="importBtn">⬆️ Импорт прогресса</button>
    <button class="btn ghost" id="wipeBtn" style="color:var(--red)">🗑 Сбросить всё</button>
    <input type="file" id="importFile" accept="application/json" class="hidden">
    <span class="muted" style="font-size:13px">Прогресс хранится локально в браузере (localStorage).</span>
  </div></div>`;
  $('#exportBtn').addEventListener('click', ()=>{
    const data = {done:state.done, xp:state.xp, name:state.name, quiz:state.quiz, exported:new Date().toISOString(), app:'PyCamp'};
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
    a.download = 'pycamp-progress.json'; a.click();
  });
  $('#importBtn').addEventListener('click', ()=>$('#importFile').click());
  $('#importFile').addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const s = JSON.parse(rd.result);
        Object.assign(state, {done:s.done||{}, xp:s.xp||0, name:s.name||'', quiz:s.quiz||{}});
        saveState(); toast('Прогресс загружен'); route();
      }catch(err){ toast('Не удалось прочитать файл'); }
    };
    rd.readAsText(f);
  });
  $('#wipeBtn').addEventListener('click', ()=>{
    if(confirm('Удалить весь прогресс, XP и сохранённый код? Действие необратимо.')){
      localStorage.removeItem(LS_KEY);
      Object.assign(state, {done:{}, code:{}, quiz:{}, xp:0, name:''});
      toast('Прогресс сброшен'); route();
    }
  });
}

/* ----------------------------- сертификат ------------------------------ */
function renderCertificate(){
  const d = doneCount(), t = LESSONS.length, ready = d === t;
  $('#view').innerHTML = `
  <h1 class="lesson-title">🎓 Сертификат</h1>
  ${ready
    ? `<p class="muted">Курс пройден на 100% — поздравляем! Впиши имя и сохрани сертификат (печать → «Сохранить как PDF»).</p>`
    : `<div class="banner warn">Сертификат откроется, когда будут пройдены все ${t} уроков. Сейчас готово <strong>${d}</strong>. <button class="btn small" data-view-go="course">Продолжить обучение</button></div>`}
  <div class="cert-wrap mt">
    <div class="cert" id="cert">
      <div class="c-logo">🐍</div>
      <h2>Сертификат об окончании</h2>
      <div class="c-sub">PyCamp Academy · Полный практический курс Python</div>
      <div class="c-name" id="certName">${esc(state.name || 'Ваше имя')}</div>
      <div class="c-text">настоящим подтверждается, что владелец сертификата прошёл ${t} интерактивных уроков курса «Python: с нуля до проектов», включая основы языка, управляющие конструкции, коллекции, строки, функции, объектно-ориентированное программирование, обработку ошибок, работу с файлами и модулями, продвинутые темы и итоговые проекты.</div>
      <div class="c-foot">
        <div>Дата: ${new Date().toLocaleDateString('ru-RU')}</div>
        <div>Опыт: ${state.xp} XP</div>
        <div>PyCamp Academy</div>
      </div>
    </div>
    <div class="cert-input">
      <input id="nameInput" placeholder="Имя и фамилия" value="${esc(state.name||'')}" ${ready?'':'disabled'}>
      <button class="btn primary" id="printCert" ${ready?'':'disabled'}>🖨 Печать / PDF</button>
    </div>
  </div>`;
  $('#nameInput')?.addEventListener('input', e=>{
    state.name = e.target.value; $('#certName').textContent = e.target.value || 'Ваше имя'; saveState();
  });
  $('#printCert')?.addEventListener('click', ()=>window.print());
}

/* ------------------------------ шпаргалка ------------------------------ */
function renderCheatsheet(){
  $('#view').innerHTML = `
  <h1 class="lesson-title">📄 Шпаргалка по Python</h1>
  <p class="muted">Всё самое нужное на одной странице. Печать: <span class="kbd">Ctrl</span>+<span class="kbd">P</span>.</p>
  <div class="grid c2 mt">
    ${CHEATSHEET.map(s=>`<div class="cheat-block"><h4>${s.title}</h4><pre>${hlPython(s.code)}</pre></div>`).join('')}
  </div>`;
}

/* ---------------------------- инициализация ---------------------------- */
function wireGlobal(){
  $('#themeToggle').addEventListener('click', ()=>{
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = state.theme;
    $('#themeToggle').textContent = state.theme === 'dark' ? '🌙' : '☀️';
    saveState();
  });
  $('#runtimeBtn').addEventListener('click', ()=>{
    if(pyStatus === 'ready') return toast(pyStatusText);
    pyStatus = 'idle'; pyPromise = null; showRuntimeBanner();
    ensurePyodide().then(()=>{ toast('Python готов!'); route(); }).catch(()=>toast(pyStatusText));
  });
  $('#tabs').addEventListener('click', e=>{
    const b = e.target.closest('[data-view]'); if(!b) return;
    navigate(b.dataset.view === 'course' ? '#/' : '#/' + b.dataset.view);
  });
  $('#lessonSearch').addEventListener('input', e=>renderSidebar(e.target.value));
  document.addEventListener('click', e=>{
    const t = e.target;
    const gl = t.closest('[data-goto-lesson]'); if(gl){ navigate('#/lesson/'+gl.dataset.gotoLesson); return; }
    const vg = t.closest('[data-view-go]');   if(vg){ navigate(vg.dataset.viewGo === 'course' ? '#/' : '#/'+vg.dataset.viewGo); return; }
    const tm = t.closest('[data-toggle-module]');
    if(tm){
      const el = tm.closest('.module'); el.classList.toggle('open');
      state.openModules[tm.dataset.toggleModule] = el.classList.contains('open'); saveState(); return;
    }
    const ll = t.closest('[data-lesson]'); if(ll){ navigate('#/lesson/'+ll.dataset.lesson); return; }
  });
  $('#burger').addEventListener('click', ()=>{
    const sb = $('#sidebar'); sb.classList.toggle('open');
    if(sb.classList.contains('open') && !$('.backdrop')){
      const bd = document.createElement('div'); bd.className = 'backdrop';
      bd.onclick = ()=>{ sb.classList.remove('open'); bd.remove(); };
      document.body.appendChild(bd);
    } else { const bd = $('.backdrop'); if(bd) bd.remove(); }
  });
  window.addEventListener('hashchange', route);
}

function boot(){
  indexCourse();
  loadState();
  document.documentElement.dataset.theme = state.theme === 'light' ? 'light' : 'dark';
  $('#themeToggle').textContent = document.documentElement.dataset.theme === 'dark' ? '🌙' : '☀️';
  updateRuntimeBtn();
  wireGlobal();
  if(!location.hash) location.hash = '#/';
  route();
  setTimeout(()=>{ ensurePyodide().catch(()=>{}); }, 700);
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
