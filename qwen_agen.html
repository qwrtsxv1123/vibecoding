
<!DOCTYPE html>

  ╔══════════════════════════════════════════════════════════════════╗

  ║  выполнения Python (Pyodide/WASM), автотесты, квизы, песочница,  ║
  ║  шпаргалка, прогресс с сохранением в localStorage и сертификат.  ║
  ║                                                                  ║
  ║  Как пользоваться: просто откройте этот файл в браузере.         ║
  ║  Для запуска кода нужен интернет один раз — подгружается         ║
  ║  интерпретатор Python с CDN jsDelivr (~10 МБ, кэшируется).       ║
  ║  Без сети работают теория, квизы, шпаргалка и прогресс.          ║
  ║                                                                  ║
  ║  Горячие клавиши: Ctrl+Enter — запуск, Ctrl+Shift+Enter —        ║
  ║  проверка, Tab — отступ, Alt+← / Alt+→ — предыдущий/следующий    ║

<html lang="ru" data-theme="dark">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a23'/><text y='68' x='50' font-size='60' text-anchor='middle'>🐍</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyCamp — бесплатный интерактивный курс Python</title>
<meta name="description" content="PyCamp — аналог freeCodeCamp: полный практический курс Python прямо в браузере. 60+ уроков, живая среда выполнения, тесты, проекты и сертификат.">
<style>
/* ============================================================
   PyCamp — single-file interactive Python course
   ============================================================ */
:root{
  --bg:#0a0a23; --bg2:#1b1b32; --bg3:#2a2a40; --bg4:#34344e;
  --text:#f5f6f7; --muted:#9ea5b8; --border:#3b3b5c;
  --accent:#f1be32; --accent-ink:#0a0a23; --blue:#99c9ff; --green:#4ade80; --red:#ff6b6b;
  --code-bg:#0d0d1c; --code-text:#e6e6f0; --shadow:0 8px 24px rgba(0,0,0,.35);
  --radius:10px; --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
html[data-theme="light"]{
  --bg:#f7f8fc; --bg2:#ffffff; --bg3:#eef0f7; --bg4:#e2e5f0;
  --text:#14162b; --muted:#5c6479; --border:#d7dbe8;
  --accent:#b8860b; --accent-ink:#ffffff; --blue:#1c5fa8; --green:#177a3d; --red:#c62828;
  --code-bg:#1e1e2e; --code-text:#e6e6f0; --shadow:0 6px 18px rgba(20,22,43,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
a{color:var(--blue)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--border)}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:14px;
  padding:10px 16px; background:var(--bg2); border-bottom:1px solid var(--border);
}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.3px;white-space:nowrap}
.logo .mark{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:17px;
  background:linear-gradient(135deg,var(--accent),#ff9f1c); color:#0a0a23; box-shadow:0 2px 8px rgba(241,190,50,.35)
}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{
  background:transparent;border:1px solid transparent;color:var(--muted);
  padding:7px 13px;border-radius:8px;font-size:14px;font-weight:600;transition:.15s
}
.tab:hover{color:var(--text);background:var(--bg3)}
.tab.active{color:var(--accent-ink);background:var(--accent)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.xp-pill{
  display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);
  padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap
}
.icon-btn{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-size:16px;transition:.15s
}
.icon-btn:hover{background:var(--bg4)}
#burger{display:none}

/* ---------- layout ---------- */
.layout{display:flex;align-items:flex-start;min-height:calc(100vh - 58px)}
.sidebar{
  width:330px;flex:0 0 330px;background:var(--bg2);border-right:1px solid var(--border);
  position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;padding:14px 12px 40px
}
.sidebar-head{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.progress-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.progress-card .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600}
.bar{height:9px;background:var(--bg4);border-radius:999px;overflow:hidden;margin-top:7px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ff9f1c);width:0;transition:width .4s}
.search{
  width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:14px;outline:none
}
.search:focus{border-color:var(--accent)}
.module{margin-bottom:6px;border:1px solid transparent;border-radius:var(--radius)}
.module-head{
  width:100%;display:flex;align-items:center;gap:9px;background:transparent;border:0;
  color:var(--text);padding:9px 8px;border-radius:8px;text-align:left;font-size:14.5px;font-weight:700
}
.module-head:hover{background:var(--bg3)}
.module-head .chev{margin-left:auto;font-size:11px;color:var(--muted);transition:.2s}
.module.open .chev{transform:rotate(90deg)}
.module-head .m-ico{font-size:16px}
.module-head .m-cnt{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--bg3);padding:1px 7px;border-radius:999px}
.lessons{display:none;padding:2px 0 6px 6px}
.module.open .lessons{display:block}
.lesson-link{
  display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;border-left:2px solid var(--border);
  color:var(--muted);padding:6px 9px;font-size:13.6px;text-align:left;border-radius:0 7px 7px 0;transition:.12s
}
.lesson-link:hover{background:var(--bg3);color:var(--text)}
.lesson-link.active{border-left-color:var(--accent);background:var(--bg3);color:var(--text);font-weight:700}
.lesson-link .tick{width:16px;height:16px;flex:0 0 16px;border:2px solid var(--border);border-radius:50%;display:grid;place-items:center;font-size:10px;color:transparent}
.lesson-link.done .tick{background:var(--green);border-color:var(--green);color:#06240f}
.lesson-link .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px;min-width:20px}

/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:22px 26px 70px}
.view{max-width:1600px;margin:0 auto}
.hero{
  background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);
  border-radius:16px;padding:26px 28px;margin-bottom:22px;box-shadow:var(--shadow)
}
.hero h1{margin:0 0 8px;font-size:30px;line-height:1.25}
.hero p{margin:0 0 16px;color:var(--muted);max-width:70ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  border:1px solid var(--border);background:var(--bg3);color:var(--text);
  padding:9px 17px;border-radius:8px;font-size:14.5px;font-weight:700;transition:.15s;text-decoration:none;display:inline-flex;align-items:center;gap:7px
}
.btn:hover{background:var(--bg4);transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.green{background:var(--green);color:#06240f;border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:start}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{
  display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--border);
  font-weight:700;font-size:14px;background:var(--bg3);border-radius:var(--radius) var(--radius) 0 0;flex-wrap:wrap
}
.card-body{padding:16px 18px}
.crumb{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
.lesson-title{font-size:26px;margin:0 0 6px;line-height:1.3}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);color:var(--muted)}
.badge.xp{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.badge.done{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}

/* markdown content */
.md h3{font-size:19px;margin:22px 0 8px}
.md h4{font-size:16px;margin:18px 0 6px;color:var(--blue)}
.md p{margin:10px 0}
.md ul,.md ol{margin:10px 0;padding-left:22px}
.md li{margin:5px 0}
.md code{font-family:var(--mono);font-size:.9em;background:var(--bg3);border:1px solid var(--border);padding:1.5px 5px;border-radius:5px;color:var(--accent)}
.md pre{
  background:var(--code-bg);color:var(--code-text);border:1px solid var(--border);
  padding:13px 15px;border-radius:9px;overflow-x:auto;margin:12px 0;font-size:13.6px;line-height:1.55
}
.md pre code{background:none;border:0;padding:0;color:inherit;font-size:inherit}
.md blockquote{border-left:3px solid var(--accent);margin:14px 0;padding:6px 14px;background:var(--bg3);border-radius:0 8px 8px 0;color:var(--muted)}
.md table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px}
.md th,.md td{border:1px solid var(--border);padding:7px 10px;text-align:left}
.md th{background:var(--bg3)}
.note{border-left:3px solid var(--blue);background:var(--bg3);padding:9px 13px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14.5px}
.task{border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 9%,var(--bg2));border-radius:9px;padding:12px 15px;margin:16px 0}
.task .t-h{font-weight:800;color:var(--accent);font-size:13.5px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;display:flex;gap:7px;align-items:center}

/* ---------- editor ---------- */
.workspace{display:flex;flex-direction:column;gap:14px;position:sticky;top:74px}
.editor-shell{overflow:hidden}
.editor-top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.file-tab{display:flex;align-items:center;gap:7px;background:var(--code-bg);color:var(--code-text);padding:4px 11px;border-radius:7px 7px 0 0;font-family:var(--mono);font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block}
.editor{display:flex;background:var(--code-bg);position:relative;height:38vh;min-height:210px;max-height:430px}
.gutter{
  flex:0 0 46px;padding:12px 8px 12px 0;text-align:right;font-family:var(--mono);font-size:13px;line-height:1.55;
  color:#5a5f7a;background:var(--code-bg);overflow:hidden;user-select:none;border-right:1px solid #23233a
}
.code-area{position:relative;flex:1;min-width:0;overflow:hidden}
#highlight,#codeInput{
  margin:0;padding:12px 14px;font-family:var(--mono);font-size:13.6px;line-height:1.55;
  white-space:pre;tab-size:4;border:0;outline:none;position:absolute;inset:0
}
#highlight{color:var(--code-text);pointer-events:none;background:transparent;overflow:hidden}
#codeInput{
  width:100%;height:100%;background:transparent;color:transparent;
  caret-color:var(--accent);resize:none;display:block;overflow:auto
}
#codeInput::selection{background:rgba(153,201,255,.28)}
.editor-actions{display:flex;gap:8px;padding:10px 12px;background:var(--bg3);border-top:1px solid var(--border);flex-wrap:wrap;align-items:center}
.kbd{font-family:var(--mono);font-size:11px;background:var(--bg4);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}

/* syntax colors */
.tok-com{color:#6a9955;font-style:italic}
.tok-str{color:#ce9178}
.tok-num{color:#b5cea8}
.tok-kw{color:#c586c0;font-weight:600}
.tok-bi{color:#4ec9b0}
.tok-fn{color:#dcdcaa}
.tok-op{color:#d4d4d4}
.tok-self{color:#569cd6;font-style:italic}
.tok-dec{color:#d7ba7d}

/* ---------- console ---------- */
.console{display:flex;flex-direction:column;min-height:180px}
.console-tabs{display:flex;gap:2px;background:var(--bg3);border-bottom:1px solid var(--border)}
.ctab{background:transparent;border:0;color:var(--muted);padding:9px 15px;font-size:13px;font-weight:700;border-bottom:2px solid transparent}
.ctab.active{color:var(--text);border-bottom-color:var(--accent)}
.console-body{padding:12px 14px;font-family:var(--mono);font-size:13.2px;white-space:pre-wrap;word-break:break-word;max-height:26vh;overflow:auto;background:var(--code-bg);color:#d8d8e8;border-radius:0 0 var(--radius) var(--radius);min-height:120px}
.console-body .err{color:#ff8f8f}
.console-body .ok{color:#7ee787}
.console-body .dim{color:#7c819c}
.console-body .in{color:#8ab4ff}
.test-list{padding:10px 12px;max-height:30vh;overflow:auto;font-family:inherit}
.test-item{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--bg3);font-size:14px}
.test-item.pass{border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.test-item.fail{border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.test-item .ico{font-size:15px;line-height:1.4}
.test-item .det{color:var(--muted);font-size:12.8px;font-family:var(--mono);margin-top:3px;white-space:pre-wrap;word-break:break-word}
.banner{padding:11px 14px;border-radius:9px;font-size:14px;margin-bottom:14px;border:1px solid var(--border);background:var(--bg3)}
.banner.warn{border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.banner.err{border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.btn.pulse{animation:pulse 1.2s ease-out 3}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 60%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.spinner{width:15px;height:15px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* lesson nav */
.lesson-nav{display:flex;gap:10px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.spoiler{margin-top:14px;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.spoiler > summary{padding:10px 14px;background:var(--bg3);font-weight:700;font-size:14px;cursor:pointer;list-style:none}
.spoiler > summary::-webkit-details-marker{display:none}
.spoiler > summary::before{content:"▸ ";color:var(--accent)}
.spoiler[open] > summary::before{content:"▾ "}
.spoiler .sp-body{padding:4px 14px 12px}

/* quiz */
.quiz-q{border:1px solid var(--border);border-radius:9px;padding:14px;margin-bottom:13px;background:var(--bg3)}
.quiz-q .qt{font-weight:700;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 11px;border:1px solid var(--border);border-radius:8px;margin-bottom:7px;background:var(--bg2);cursor:pointer;font-size:14.5px;transition:.12s}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px}
.opt.correct{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--bg2))}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--bg2))}
.opt code{font-family:var(--mono);background:var(--code-bg);color:var(--code-text);padding:1px 5px;border-radius:4px;font-size:.92em}
.explain{font-size:13.4px;color:var(--muted);margin-top:8px;padding-left:2px}

/* grids for other views */
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat .v{font-size:32px;font-weight:800;color:var(--accent);line-height:1.1}
.stat .k{color:var(--muted);font-size:13px;margin-top:5px;font-weight:600}
.mod-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:.15s}
.mod-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.mod-card h3{margin:0 0 6px;font-size:17px}
.mod-card p{margin:0 0 12px;color:var(--muted);font-size:14px}
.section-title{font-size:22px;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
.section-title:first-child{margin-top:0}
.cheat-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;break-inside:avoid}
.cheat-block h4{margin:0 0 8px;font-size:15.5px;color:var(--accent)}
.cheat-block pre{background:var(--code-bg);color:var(--code-text);padding:11px 13px;border-radius:8px;overflow-x:auto;font-size:12.8px;margin:0;font-family:var(--mono);line-height:1.5}

/* certificate */
.cert-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.cert{
  width:min(900px,100%);aspect-ratio:1.414/1;background:#fffdf7;color:#1b1b32;border:10px double #b8860b;
  border-radius:6px;padding:44px 52px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden
}
.cert::after{content:"";position:absolute;inset:14px;border:1px solid #d8c98a;border-radius:4px;pointer-events:none}
.cert .c-logo{font-size:40px}
.cert h2{font-family:Georgia,serif;font-size:34px;margin:6px 0 2px;letter-spacing:1px}
.cert .c-sub{color:#6b6b7b;font-size:14px;margin-bottom:20px}
.cert .c-name{font-family:Georgia,serif;font-size:38px;border-bottom:2px solid #b8860b;padding:0 26px 6px;margin:8px 0 14px;min-width:52%}
.cert .c-text{max-width:62ch;font-size:15px;color:#3a3a4a}
.cert .c-foot{display:flex;justify-content:space-between;width:100%;margin-top:26px;font-size:13px;color:#6b6b7b}
.cert .c-foot div{border-top:1px solid #c9c9d4;padding-top:6px;width:32%}
.cert-input{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cert-input input{padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:15px;min-width:280px}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,140%);background:var(--bg3);border:1px solid var(--accent);
  color:var(--text);padding:11px 20px;border-radius:999px;font-weight:700;font-size:14px;z-index:200;transition:transform .35s;box-shadow:var(--shadow)}
#toast.show{transform:translate(-50%,0)}
.hidden{display:none !important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.center{text-align:center}
.mt{margin-top:14px}

/* confetti */
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:300;pointer-events:none;border-radius:2px}

@media (max-width:1180px){
  .split{grid-template-columns:1fr}
  .workspace{position:static}
  .editor{height:46vh;max-height:520px}
  .console-body{max-height:34vh}
}
@media (max-width:620px){
  .xp-pill{display:none}

    desc:`Python — один из самых популярных языков программирования: на нём пишут бэкенд, анализируют данные, обучают нейросети, автоматизируют рутину и создают ботов. Его главная фишка — синтаксис, похожий на обычный английский текст.

В PyCamp код выполняется **прямо в браузере**: настоящий интерпретатор Python (Pyodide, WebAssembly) запускает твою программу и показывает вывод в консоли справа.

### Функция print()

Всё, что программа хочет «сказать», выводится функцией \`print()\`:

~~~python
print("Привет, мир!")
print('Одинарные кавычки работают так же')
print(42)              # числа можно без кавычек
print()                # пустая строка
~~~

### Несколько аргументов: sep и end

~~~python
print("Python", 3, "простой", sep=" | ")   # разделитель
print("без", "переноса", end=" -> ")       # чем закончить вывод
print("продолжение")
~~~

Вывод:

~~~text
Python | 3 | простой
без переноса -> продолжение
~~~

### Спецсимволы

- \`\\n\` — новая строка
- \`\\t\` — табуляция
- \`\\"\` — кавычка внутри строки
- \`\\\\\` — обратный слэш

~~~python
print("Строка 1\\nСтрока 2\\tи табуляция")
print("Он сказал: \\"Привет!\\"")
~~~

:::note
Кавычки в Python равнозначны: \`"текст"\` и \`'текст'\` — одно и то же. Важно лишь закрывать строку тем же типом кавычек, которым открыл.
:::

:::task
Выведи на экран **три строки** (каждая отдельным вызовом \`print\`):

1. Привет, мир!

А затем **одним** вызовом \`print\` выведи \`Python-3.12\`, передав два аргумента и разделитель \`sep='-'\`.

`,

    tests:[

    id:'b2', title:'Переменные и типы данных', xp:20,
    desc:`**Переменная** — это имя, за которым закреплено значение. Присваивание делается одним знаком \`=\`:

~~~python
name = "Анна"        # строка (str)
age = 25             # целое число (int)
height = 1.72        # дробное число (float)
is_student = True    # логическое (bool)
nothing = None       # «ничего» (NoneType)
~~~

В Python **динамическая типизация**: тип объявлять не нужно, он определяется из значения и может меняться.

~~~python
x = 10
print(type(x))   # <class 'int'>
x = "текст"
print(type(x))   # <class 'str'>
~~~

### Правила имён

- можно использовать буквы, цифры и \`_\`, но **не начинать с цифры**;
- регистр важен: \`Name\` и \`name\` — разные переменные;
- нельзя брать ключевые слова: \`if\`, \`for\`, \`class\`, \`import\`…
- принят стиль \`snake_case\`: \`user_email\`, \`total_price\`.

### Полезные приёмы

~~~python
a, b = 1, 2          # множественное присваивание
a, b = b, a          # обмен значениями без третьей переменной
count = 0
count += 5           # то же, что count = count + 5
count *= 2           # count = count * 2  ->  10
~~~

:::note
\`=\` — это **присваивание**, а не «равно». Сравнение — это \`==\`. Частая ошибка новичка: \`if x = 5\` приведёт к синтаксической ошибке.
:::

  {
    id:'b3', title:'Числа и арифметика', xp:20,
    desc:`Два основных числовых типа: \`int\` (целые, произвольной длины) и \`float\` (дробные, с плавающей точкой).

### Операторы

~~~python
7 + 3      # 10   сложение
7 - 3      # 4    вычитание
7 * 3      # 21   умножение
7 / 3      # 2.3333333333333335  деление (всегда float!)
7 // 3     # 2    целочисленное деление (пол)
7 % 3      # 1    остаток от деления
7 ** 3     # 343  возведение в степень
-7 // 2    # -4   округление вниз, а не к нулю
~~~

### Приоритет операций

Как в математике: \`**\` → \`* / // %\` → \`+ -\`. Скобки меняют порядок: \`(2 + 3) * 4 == 20\`.

### Округление и преобразование

~~~python
round(3.14159, 2)   # 3.14
round(2.5)          # 2  (!!! «банковское» округление к чётному)
int(3.99)           # 3  (отбрасывает дробную часть)
float("2.5")        # 2.5
int("42") + 1       # 43
divmod(17, 5)       # (3, 2) — частное и остаток сразу
~~~

:::note
Дроби хранятся приближённо: \`0.1 + 0.2\` даст \`0.30000000000000004\`. Для денег округляй результат (\`round(x, 2)\`) или используй модуль \`decimal\`.
:::

:::task
Магазин: цена вещи \`price = 200\`, количество \`count = 3\`, скидка \`discount = 10\` процентов.

Выведи **точно в таком виде**:

~~~text

Скидка: 60.0
Итого: 540.0
~~~

Затем проверь арифметику и выведи:

~~~text
17 // 5 = 3
17 % 5 = 2
2 ** 10 = 1024
~~~

    id:'b4', title:'Строки: индексация и срезы', xp:20,
    desc:`Строка \`str\` — последовательность символов. Каждый символ доступен по **индексу** (нумерация с нуля), а отрицательные индексы считают с конца.

~~~python
s = "Pythonista"
s[0]      # 'P'
s[5]      # 'n'
s[-1]     # 'a'  (последний)
s[-2]     # 't'
len(s)    # 10
~~~

### Срезы [начало:конец:шаг]

Конец **не включается**. Пропущенное начало — это 0, пропущенный конец — длина строки.

~~~python
s = "Pythonista"
s[:6]      # 'Python'
s[6:]      # 'ista'
s[2:6]     # 'thon'
s[::2]     # 'Ptoita'  (каждый второй)
s[::-1]    # 'atsinohtyP'  (переворот строки)
~~~

### Строки неизменяемы

~~~python
s = "кот"
# s[0] = "К"   -> TypeError
s = "К" + s[1:]   # правильно: создаём новую строку
~~~

### Частые операции

~~~python
"Py" + "thon"     # 'Python'   конкатенация
"ha" * 3          # 'hahaha'   повторение
"thon" in s       # True       проверка вхождения
s.upper(), s.lower()
s.strip()         # убрать пробелы по краям
s.replace("a", "A")
s.split("o")      # ['Pyth', 'nista']
", ".join(["a","b"])   # 'a, b'
s.startswith("Py"), s.endswith("ta"), s.find("n"), s.count("t")
~~~

~~~python

### Форматирование чисел

~~~python
pi = 3.14159265
print(f"{pi:.2f}")      # 3.14      — 2 знака после запятой
print(f"{pi:.4f}")      # 3.1416
print(f"{1234567:,}")   # 1,234,567 — разделители тысяч
print(f"{1234567:_}")   # 1_234_567
print(f"{0.856:.1%}")   # 85.6%     — проценты
print(f"{255:b} {255:o} {255:x}")   # 11111111 377 ff — системы счисления
~~~

### Выравнивание и ширина

~~~python
print(f"{'товар':<10}|{'цена':>8}|")   # < влево, > вправо, ^ по центру

print(f"{7:0>3}")    # '007'  (заполнитель 0)
print(f"{7:^5}")     # '  7  '
~~~

~~~python

~~~

### Комментарии

~~~python
# Однострочный комментарий начинается с решётки
x = 5  # комментарий может быть в конце строки

"""
Многострочная строка.
Так часто оформляют docstring — описание функции или модуля.

Комментарий объясняет **почему** сделано именно так, а не что делает каждая строка.

### Docstring

~~~python
def area(w, h):
    """Возвращает площадь прямоугольника со сторонами w и h."""
    return w * h
~~~

### Главные правила PEP 8

- отступ одного уровня — **4 пробела** (табуляцию не смешивать с пробелами);
- имена: переменные и функции — \`snake_case\`, классы — \`CamelCase\`, константы — \`UPPER_SNAKE_CASE\`;
- вокруг бинарных операторов пробелы: \`x = a + b\`, но в аргументах по умолчанию без пробелов: \`def f(x=1)\`;
- длина строки — до 79 символов;
- \`import\` — в начале файла, каждый на своей строке;
- две пустые строки между функциями верхнего уровня, одна — между методами.

### Почему отступы важны

В Python блоки кода выделяются **отступами**, а не фигурными скобками:

~~~python
if x > 0:
    print("положительное")   # входит в if
    print("всё ещё в блоке") # входит в if
print("уже вне блока")       # выполняется всегда
~~~

Ошибка \`IndentationError\` означает, что отступы внутри одного блока разные.

~~~python
5 > 3      # True
5 == 5.0   # True  (значения равны, типы разные)

### Цепочки сравнений

~~~python
x = 7
1 < x < 10        # True  — работает как в математике
1 < x < 5 == 5    # можно и длиннее
~~~

### == против is

- \`==\` сравнивает **значения**;
- \`is\` сравнивает **идентичность объектов** (один и тот же объект в памяти).

~~~python
[1, 2] == [1, 2]   # True
[1, 2] is [1, 2]   # False — это два разных списка
x is None          # правильный способ проверить None
~~~

### «Правдивость» значений

В условии любое значение приводится к \`bool\`. Ложными считаются: \`False\`, \`0\`, \`0.0\`, \`\"\"\`, \`[]\`, \`{}\`, \`()\`, \`None\`. Всё остальное — истинно.

~~~python
bool("")        # False
bool("0")       # True  (!!! непустая строка)
bool([])        # False
bool([0])       # True
~~~

~~~python
age = 20

if age >= 18:
    print("Доступ разрешён")
elif age >= 13:
    print("Только подростковый раздел")
else:
    print("Доступ запрещён")
~~~

Правила:

- после условия — **двоеточие**, блок — с отступом 4 пробела;
- \`elif\` («иначе если») может быть сколько угодно, проверяются сверху вниз;
- \`else\` — необязательный «план Б»;
- как только ветка сработала, остальные **пропускаются**.

### Типичные ошибки

~~~python

if x > 0        # SyntaxError
# 2) присваивание вместо сравнения
if x = 5:       # SyntaxError, нужно ==
# 3) разные отступы в одном блоке -> IndentationError
~~~

### Вложенные условия

~~~python
if is_logged_in:
    if is_admin:
        print("Панель управления")
    else:
        print("Профиль")
~~~

Глубокую вложенность лучше «распрямлять» через \`and\`/\`or\` или ранние возвраты.

### Приоритет

\`not\` → \`and\` → \`or\`. Скобки делают код понятнее: \`if (a or b) and c:\`.

### Ленивые вычисления (short-circuit)

Python не вычисляет второе операндное выражение, если результат уже ясен:

~~~python
x = 0
if x != 0 and 10 / x > 2:   # деления не будет — x == 0
    ...
~~~

Это удобно для защиты от ошибок.

"name" in {"name": "Ann"} # True — проверка ключей словаря
5 not in [1, 2]           # True
~~~

### Guard clause — «охрана» вместо вложенности

Плохо (много вложенности):

~~~python
def process(user):
    if user is not None:
        if user.active:
            if user.age >= 18:
                print("Работаем")
~~~

Хорошо (проверяем исключения и выходим):

~~~python
def process(user):
    if user is None:
        return
    if not user.active:
        return
    if user.age < 18:
        return
    print("Работаем")
~~~

Код читается сверху вниз, основной сценарий не «тонет» в отступах.

    n -= 1

### while с вводом

~~~python
password = ""
while password != "secret":
    password = input("Пароль: ")

~~~python
while True:
    cmd = input("> ")
    if cmd == "exit":
        break
    print("выполняю", cmd)
~~~

### sort() против sorted()

- \`list.sort()\` меняет список **на месте** и возвращает \`None\`;
- \`sorted(list)\` возвращает **новый** список, исходный не трогает.

~~~python
words = ["bbb", "a", "cc"]
sorted(words)                # ['a', 'bbb', 'cc']
sorted(words, key=len)       # ['a', 'cc', 'bbb']
sorted(words, reverse=True)
~~~

### Операции

~~~python
a = {1, 2, 3, 4}
b = {3, 4, 5, 6}

a | b            # объединение        {1,2,3,4,5,6}
a & b            # пересечение         {3,4}
a - b            # разность            {1,2}
a ^ b            # симметрическая      {1,2,5,6}
{1, 2} <= a      # подмножество        True
3 in a           # True — проверка за O(1), быстрее чем в списке
~~~

Те же операции методами: \`a.union(b)\`, \`a.intersection(b)\`, \`a.difference(b)\`, \`a.symmetric_difference(b)\`, \`a.issubset(b)\`.

Правило «верного» адреса: после \`strip()\` ровно один символ \`@\`, непустая локальная часть, в домене есть точка, а зона состоит только из букв. Разрешённые домены: \`mail.ru\`, \`pycamp.io\`, \`gmail.com\`.

~~~python
import re

re.search(r"\\d+", "заказ 123")        # первый подходящий объект Match
re.findall(r"\\d+", "a1 b22 c333")     # ['1', '22', '333']
re.match(r"\\d+", "123abc")            # ищет только в начале строки
re.fullmatch(r"\\d+", "123")           # строка целиком должна подходить
re.sub(r"\\d", "#", "a1b2")            # 'a#b#'
re.split(r"[,;\\s]+", "a, b;c  d")     # ['a', 'b', 'c', 'd']
~~~

### Основные метасимволы

~~~text
.    любой символ          \\d   цифра           \\w   буква/цифра/_
*    0 и более             \\D   не цифра        \\s   пробел
+    1 и более             [abc] один из        \\b   граница слова
?    0 или 1               {2,4} от 2 до 4      ^  $ начало/конец
~~~

### Примеры шаблонов

~~~python
r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"     # email
r"\\+7[\\s-]?\\d{3}[\\s-]?\\d{3}-?\\d{2}-?\\d{2}"            # телефон
r"\\b\\d{4}-\\d{2}-\\d{2}\\b"                              # дата 2024-05-01
r"^(\\w+)\\s+(\\w+)$"                                  # два слова
~~~

### Группы

~~~python
m = re.search(r"(\\d+)-(\\d+)", "код 12-34")
m.group(0)     # '12-34'  всё совпадение
m.group(1)     # '12'
m.groups()     # ('12', '34')
~~~

:::note
Перед шаблоном всегда ставь \`r\` (raw-строка): \`r"\\d+"\` — иначе Python съест обратные слэши.
:::

- \`def\` + имя + скобки с параметрами + двоеточие;

- \`return\` возвращает значение и **прерывает** функцию;

### global

~~~python
counter = 0

def increment():
    global counter        # объявляем работу с глобальной
    counter += 1
~~~

Без \`global\` строка \`counter += 1\` упадёт с \`UnboundLocalError\`.

### nonlocal и замыкания

\`nonlocal\` ссылается на переменную **внешней функции**:

~~~python
def make_counter():
    count = 0
    def counter():
        nonlocal count
        count += 1
        return count
    return counter

c = make_counter()
c()   # 1
c()   # 2  — состояние сохраняется между вызовами!
~~~

Это и есть **замыкание**: внутренняя функция «запоминает» окружение, в котором создана.

~~~python
def add(item, bag=None):
    if bag is None:
        bag = []
    bag.append(item)
    return bag
~~~

    desc:`**Рекурсия** — когда функция вызывает саму себя. Обязательны два элемента:

1. **базовый случай** — условие остановки;
2. **рекурсивный шаг** — вызов с «уменьшенной» задачей.

~~~python
def factorial(n):
    if n <= 1:            # базовый случай
        return 1
    return n * factorial(n - 1)     # рекурсивный шаг

factorial(5)   # 120
~~~

### Классические примеры

~~~python
def fib(n):
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)

def sum_digits(n):
    if n < 10:
        return n
    return n % 10 + sum_digits(n // 10)
~~~

### Где рекурсия уместна

- обход деревьев, вложенных словарей и файловых систем;
- «разделяй и властвуй»: быстрая сортировка, бинарный поиск;
- задачи, которые естественно описываются через себя.

### Ограничения

~~~python
import sys
sys.getrecursionlimit()     # по умолчанию 1000
~~~

Глубокая рекурсия → \`RecursionError\`. Кроме того, наивная \`fib\` экспоненциально медленна: её ускоряют мемоизацией.

~~~python
from functools import lru_cache

@lru_cache(maxsize=None)
def fib(n):
    return n if n < 2 else fib(n - 1) + fib(n - 2)
~~~

:::task
Реализуй через **рекурсию** (функция должна вызывать саму себя):

1. \`factorial(n)\` — факториал, \`factorial(0) == 1\`.
2. \`fib(n)\` — число Фибоначчи: \`fib(0) == 0\`, \`fib(1) == 1\`, \`fib(10) == 55\`.
3. \`sum_digits(n)\` — сумма цифр неотрицательного числа: \`sum_digits(98765) == 35\`.
4. \`is_palindrome(s)\` — является ли строка палиндромом (без учёта регистра): \`is_palindrome("топот") == True\`.
:::`,
    starter:`# def factorial(n): ...
# def fib(n): ...
# def sum_digits(n): ...
# def is_palindrome(s): ...

print(factorial(5))
print(fib(10))
`,
    hint:`\`sum_digits\`: базовый случай \`n < 10\` → вернуть \`n\`; иначе \`n % 10 + sum_digits(n // 10)\`. \`is_palindrome\`: базовый случай — строка короче 2 символов; иначе сравнить первый и последний символ и вызвать себя для середины \`s[1:-1]\`.`,
    solution:`def factorial(n):
    if n <= 1:
        return 1
    return n * factorial(n - 1)

    s = s.lower()

        return True
    if s[0] != s[-1]:
        return False
    return is_palindrome(s[1:-1])

### Какие проверки обычно делают

- длина ≥ 8 символов;
- есть хотя бы одна цифра;
- есть заглавная буква;
- есть спецсимвол из набора \`!@#$%^&*\`.

Проверку можно писать через циклы:

~~~python
has_digit = any(ch.isdigit() for ch in password)
has_upper = any(ch.isupper() for ch in password)
has_special = any(ch in "!@#$%^&*" for ch in password)
~~~

\`any()\` возвращает \`True\`, если хотя бы один элемент последовательности истинен; \`all()\` — если истинны все.

### Маскирование

Показывать пароль в логах нельзя, поэтому его «прячут»:

~~~python
def mask(pw):
    if len(pw) <= 4:
        return "*" * len(pw)
    return pw[:2] + "*" * (len(pw) - 4) + pw[-2:]
~~~

:::task
Реализуй три функции:

1. \`check_password(pw)\` → словарь из четырёх булевых значений с ключами \`length\` (≥8), \`digit\`, \`upper\`, \`special\` (один из \`!@#$%^&*\`).
2. \`strength(pw)\` → строка:
   - 0–1 выполненных условия → \`слабый\`
   - 2–3 → \`средний\`
   - 4 → \`надёжный\`
3. \`mask(pw)\` → \`Ab****gh\` для 8-символьного пароля (первые 2 и последние 2 символа, остальное — звёздочки); для паролей длиной ≤ 4 — только звёздочки.
:::`,
    starter:`SPECIAL = "!@#$%^&*"

# def check_password(pw): ...
# def strength(pw): ...
# def mask(pw): ...

print(check_password("Ab1!efgh"))
print(strength("abc"))
print(mask("Ab1!efgh"))
`,
    hint:`\`check_password\` удобно собрать так: \`{"length": len(pw) >= 8, "digit": any(c.isdigit() for c in pw), ...}\`. \`strength\` считает сумму \`True\`-значений: \`score = sum(check_password(pw).values())\`.`,
    solution:`SPECIAL = "!@#$%^&*"

def check_password(pw):
    return {
        "length": len(pw) >= 8,
        "digit": any(ch.isdigit() for ch in pw),
        "upper": any(ch.isupper() for ch in pw),
        "special": any(ch in SPECIAL for ch in pw),
    }

def strength(pw):
    score = sum(check_password(pw).values())
    if score <= 1:
        return "слабый"
    if score <= 3:
        return "средний"
    return "надёжный"

def mask(pw):
    if len(pw) <= 4:
        return "*" * len(pw)
    return pw[:2] + "*" * (len(pw) - 4) + pw[-2:]

print(check_password("Ab1!efgh"))
print(strength("abc"), strength("Abcdefgh"), strength("Ab1!efgh"))
print(mask("Ab1!efgh"), mask("abc"))`,

assert check_password("abc") == {"length": False, "digit": False, "upper": False, "special": False}
assert check_password("Abcdefgh") == {"length": True, "digit": False, "upper": True, "special": False}`},
      {name:'strength оценивает надёжность', code:`assert strength("abc") == "слабый"
assert strength("Abcdefgh") == "средний"
assert strength("abcdefgh1") == "средний"
assert strength("Ab1!efgh") == "надёжный"`},

assert mask("abc") == "***"
assert mask("abcdefghij") == "ab******ij"`}
    ]
  }

    desc:`Когда программа сталкивается с проблемой, Python **бросает исключение**. Если его не обработать, программа падает с трассировкой.

~~~python
try:
    x = int("abc")          # здесь возникнет ошибка
except ValueError as e:
    print("Не удалось преобразовать:", e)
~~~

### Полная конструкция

~~~python
try:
    result = 10 / n
except ZeroDivisionError:
    print("деление на ноль")
except (TypeError, ValueError) as e:
    print("проблема с типом или значением:", e)
else:
    print("ошибок не было, результат:", result)   # только если try отработал
finally:
    print("выполнится всегда — здесь закрывают ресурсы")
~~~

### Самые частые исключения

~~~text
ValueError        int("abc")               — неподходящее значение
TypeError         "2" + 2                  — неподходящий тип
KeyError          d["нет"]                 — нет ключа в словаре
IndexError        lst[10]                  — нет индекса
ZeroDivisionError x / 0
AttributeError    obj.нет_такого
NameError         print(x) до определения
FileNotFoundError open("нет.txt")
StopIteration     next() у пустого итератора
~~~

### EAFP против LBYL

Python предпочитает «проще попросить прощения, чем разрешения»:

~~~python
# LBYL (look before you leap)
if key in d:
    value = d[key]

# EAFP (easier to ask forgiveness)
try:
    value = d[key]
except KeyError:
    value = None

# а лучше — вообще без исключений
value = d.get(key)
~~~

:::note
Не пиши «голый» \`except:\` — он ловит вообще всё, включая \`KeyboardInterrupt\` и программные баги, из-за чего ошибки становятся невидимыми. Указывай конкретные типы.
:::

:::task
Реализуй функции с безопасной обработкой ошибок:

1. \`safe_divide(a, b)\` — возвращает результат деления, а при делении на ноль — \`None\`.
2. \`safe_int(value)\` — возвращает \`int\` из строки, а если преобразование невозможно — \`None\`.
3. \`safe_get(data, key, default=None)\` — значение словаря по ключу или \`default\` (без \`KeyError\`).
4. \`describe_error(fn)\` — вызывает функцию \`fn\` без аргументов и возвращает **имя класса** возникшего исключения (строку, например \`"ZeroDivisionError"\`), а если ошибки не было — \`None\`.
:::`,
    starter:`# def safe_divide(a, b): ...
# def safe_int(value): ...
# def safe_get(data, key, default=None): ...
# def describe_error(fn): ...

print(safe_divide(10, 2), safe_divide(10, 0))
print(safe_int("42"), safe_int("abc"))
`,
    hint:`Имя класса исключения: \`except Exception as e: return type(e).__name__\`. Для словаря можно обойтись \`data.get(key, default)\`, но потренируйся с \`try/except KeyError\`.`,
    solution:`def safe_divide(a, b):
    try:
        return a / b
    except ZeroDivisionError:
        return None

def safe_int(value):
    try:
        return int(value)
    except (ValueError, TypeError):
        return None

def safe_get(data, key, default=None):
    try:
        return data[key]
    except (KeyError, TypeError):
        return default

def describe_error(fn):
    try:
        fn()
    except Exception as e:
        return type(e).__name__
    return None

print(safe_divide(10, 2), safe_divide(10, 0))
print(safe_int("42"), safe_int("abc"))
print(safe_get({"a": 1}, "b", "нет"))
print(describe_error(lambda: 1 / 0))`,

assert safe_int("abc") is None
assert safe_int("  -7 ") == -7`},
      {name:'safe_get', code:`assert safe_get({"a": 1}, "a") == 1
assert safe_get({"a": 1}, "b") is None
assert safe_get({"a": 1}, "b", "нет") == "нет"`},

def set_age(age):

### Повторный выброс и цепочки

~~~python
try:
    data = json.loads(text)
except json.JSONDecodeError:
    logger.error("битый JSON")
    raise                      # пробросить дальше без потери контекста
~~~

\`raise NewError("...") from exc\` — явно связывает причину.

### Свои классы исключений

~~~python
class AppError(Exception):
    """Базовая ошибка приложения."""

class ValidationError(AppError):
    def __init__(self, field, message):
        super().__init__(f"{field}: {message}")
        self.field = field

raise ValidationError("email", "неверный формат")
~~~

Наследование от \`Exception\` (а не от \`BaseException\`) обязательно: \`BaseException\` ловить не принято.

### assert

~~~python
assert total >= 0, "Сумма не может быть отрицательной"
~~~

\`assert\` — для внутренних проверок во время разработки. В продакшене он отключается флагом \`python -O\`, поэтому валидацию пользовательских данных делай через \`raise\`.

    desc:`Файлы открывают функцией \`open()\` и **обязательно** закрывают. Лучший способ — контекстный менеджер \`with\`: он закроет файл сам, даже если возникнет ошибка.

~~~python
with open("notes.txt", "w", encoding="utf-8") as f:
    f.write("строка 1\\n")
    f.writelines(["строка 2\\n", "строка 3\\n"])
~~~

### Режимы открытия

~~~text
"r"   чтение (по умолчанию), ошибка если файла нет
"w"   запись — файл СОЗДАЁТСЯ или ОЧИЩАЕТСЯ
"a"   дозапись в конец
"x"   создание нового файла (ошибка, если существует)
"r+"  чтение и запись
"b"   бинарный: "rb", "wb"  (для картинок, архивов)
~~~

### Чтение

~~~python
with open("notes.txt", encoding="utf-8") as f:
    text = f.read()          # весь файл одной строкой
    lines = f.readlines()    # список строк (с \\n на конце)

with open("notes.txt", encoding="utf-8") as f:
    for line in f:           # построчно — экономит память
        print(line.strip())
~~~

### Пути

~~~python
import os
os.path.exists("notes.txt")
os.path.join("data", "notes.txt")   # data/notes.txt
os.listdir(".")
os.makedirs("data/reports", exist_ok=True)
~~~

    except json.JSONDecodeError:
        return None

def save_json(obj, path):

### Пакет

Пакет — папка с модулями и файлом \`__init__.py\`:

~~~text

~~~python
def main():

class BankAccount:
    def __init__(self, owner, balance=0):

        self.balance = balance

        self.operations.append(("deposit", amount))
        return True

    def withdraw(self, amount):
        if amount <= 0 or amount > self.balance:
            return False
        self.balance -= amount
        self.operations.append(("withdraw", amount))

    def statement(self):
        return f"{self.owner}: {self.balance} ₽, операций: {len(self.operations)}"

~~~python
class ShoppingCart:
    def __init__(self):
        self.items = {}                 # {название: {"price": .., "qty": ..}}

    def add(self, name, price, qty=1):
        if name in self.items:
            self.items[name]["qty"] += qty
        else:
            self.items[name] = {"price": price, "qty": qty}

    def remove(self, name):
        return self.items.pop(name, None) is not None

    def total(self):
        return sum(i["price"] * i["qty"] for i in self.items.values())

    def count(self):
        return sum(i["qty"] for i in self.items.values())

    def __len__(self):
        return len(self.items)

    desc:`Наследование позволяет создать новый класс на основе существующего:

~~~python
class Animal:
    def __init__(self, name):
        self.name = name

    def speak(self):
        return "..."

    def info(self):
        return f"{self.name}: {self.speak()}"

class Dog(Animal):
    def speak(self):                       # переопределение метода
        return "Гав!"

    def __init__(self, name, indoor=True):

        self.indoor = indoor

### Ключевые моменты

- \`class Dog(Animal)\` — Dog наследует Animal;
- переопределённый метод **заменяет** родительский;
- \`super()\` — доступ к реализации родителя;
- \`issubclass(Dog, Animal)\` → \`True\`, \`isinstance(d, Animal)\` → \`True\`.

### Расширение поведения

~~~python
class Employee:
    def __init__(self, name, salary):
        self.name = name
        self.salary = salary

    def total(self):
        return self.salary

class Manager(Employee):
    def __init__(self, name, salary, bonus):
        super().__init__(name, salary)
        self.bonus = bonus

    def total(self):
        return super().total() + self.bonus     # переиспользуем расчёт родителя
~~~

В Python нет приватных полей в стиле Java; есть соглашение:

- \`name\` — публичный атрибут;
- \`_name\` — «внутренний», снаружи трогать не следует;
- \`__name\` — name mangling: интерпретатор переименовывает в \`_ClassName__name\`.

~~~python
class Wallet:
    def __init__(self, balance=0):
        self._balance = balance        # только для чтения снаружи

    @property
    def balance(self):                 # геттер
        return self._balance

    def deposit(self, amount):
        if amount <= 0:
            raise ValueError("Сумма должна быть положительной")
        self._balance += amount
~~~

### Сеттер с валидацией

~~~python
class Temperature:
    def __init__(self, celsius=0):
        self.celsius = celsius         # сразу проходит через сеттер!

    @property
    def celsius(self):
        return self._celsius

    @celsius.setter
    def celsius(self, value):
        if value < -273.15:
            raise ValueError("Ниже абсолютного нуля не бывает")
        self._celsius = value

    @property
    def fahrenheit(self):              # вычисляемое свойство
        return self._celsius * 9 / 5 + 32

### Магические (dunder) методы

~~~python
class Vector2D:
    def __init__(self, x, y):
        self.x, self.y = x, y

    def __repr__(self):                     # для отладки
        return f"Vector2D({self.x}, {self.y})"

    def __str__(self):                      # для пользователя
        return f"Vector({self.x}, {self.y})"

    def __add__(self, other):               # v1 + v2
        return Vector2D(self.x + other.x, self.y + other.y)

    def __sub__(self, other):
        return Vector2D(self.x - other.x, self.y - other.y)

    def __mul__(self, k):                   # v * 3
        return Vector2D(self.x * k, self.y * k)

    def __eq__(self, other):
        return isinstance(other, Vector2D) and (self.x, self.y) == (other.x, other.y)

    def __abs__(self):                      # abs(v)
        return math.hypot(self.x, self.y)

    def __bool__(self):
        return bool(self.x or self.y)

    def __len__(self):
        return 2
~~~

    desc:`Кроме методов экземпляра есть два особых вида.

### @classmethod — метод класса

Первый параметр — \`cls\` (сам класс). Используется для **альтернативных конструкторов**:

~~~python
class Pizza:
    def __init__(self, size, toppings):
        self.size = size
        self.toppings = list(toppings)

    @classmethod
    def margherita(cls, size=30):
        return cls(size, ["моцарелла", "томаты", "базилик"])

    @classmethod
    def from_string(cls, text):
        size, toppings = text.split(":")
        return cls(int(size), [t.strip() for t in toppings.split(",")])
~~~

~~~python
Pizza.margherita()                 # объект, созданный фабрикой
Pizza.from_string("35: сыр, грибы")
~~~

### @staticmethod — просто функция в пространстве класса

Не получает ни \`self\`, ни \`cls\`:

~~~python
class Pizza:
    @staticmethod
    def is_valid_size(size):
        return 20 <= size <= 50
~~~

~~~python
Pizza.is_valid_size(30)     # True — можно вызывать без объекта
~~~

### Что выбрать

~~~text
обычный метод    self   работает с состоянием конкретного объекта
classmethod      cls    фабричные методы, работа с данными класса
staticmethod     —      вспомогательная функция, логически относящаяся к классу
~~~

- \`@classmethod from_string(cls, text)\` → разбор строки вида \`"35: сыр, грибы"\` (пробелы у названий обрезать);

    desc:`### Протокол итерации

\`for\` работает не с «коллекциями», а с **итераторами** — объектами, у которых есть методы \`__iter__\` и \`__next__\`.

~~~python
class CountDown:
    def __init__(self, start):
        self.current = start

    def __iter__(self):
        return self            # объект сам является итератором

    def __next__(self):
        if self.current <= 0:
            raise StopIteration
        self.current -= 1
        return self.current + 1

list(CountDown(3))     # [3, 2, 1]
~~~

Когда элементы заканчиваются, нужно бросить \`StopIteration\` — именно так \`for\` понимает, что пора остановиться.

### Генераторы — итераторы «в одну строку»

Функция с \`yield\` автоматически становится генератором:

~~~python
def countdown(n):
    while n > 0:
        yield n
        n -= 1

for x in countdown(3):
    print(x)      # 3 2 1
~~~

Генератор **ленивый**: значение вычисляется только когда его запросили, а вся последовательность не хранится в памяти.

~~~python
def read_big_file(path):
    with open(path, encoding="utf-8") as f:
        for line in f:
            yield line.strip()      # по одной строке, а не весь файл
~~~

### Генераторные выражения

~~~python
squares = (x * x for x in range(10**9))    # круглые скобки — генератор
sum(x * x for x in range(100))             # без промежуточного списка
~~~

\`yield from\` делегирует другой генератор:

~~~python
def chain(a, b):
    yield from a
    yield from b
~~~

### Бесконечные генераторы и itertools

~~~python
from itertools import count, islice, cycle, takewhile
list(islice(count(10, 2), 4))      # [10, 12, 14, 16]

    desc:`\`with\` гарантирует, что ресурс будет освобождён — даже если внутри блока возникнет ошибка.

### Свой контекстный менеджер

~~~python
class Transaction:
    def __init__(self, log, name):
        self.log = log
        self.name = name

    def __enter__(self):
        self.log.append(f"{self.name}: start")
        return self                # то, что попадёт в переменную после as

    def __exit__(self, exc_type, exc_value, tb):
        if exc_type is None:
            self.log.append(f"{self.name}: end")
        else:
            self.log.append(f"{self.name}: error")
        return False               # False — не подавлять исключение
~~~

~~~python
log = []
with Transaction(log, "save"):
    ...
# log == ['save: start', 'save: end']
~~~

Возврат \`True\` из \`__exit__\` **подавляет** исключение — используй это осознанно.

### Через декоратор contextmanager

~~~python
from contextlib import contextmanager

@contextmanager
def tag(name):
    print(f"<{name}>")
    try:
        yield                     # здесь выполняется тело with
    finally:
        print(f"</{name}>")
~~~

Код до \`yield\` — это «вход», после — «выход». \`finally\` гарантирует выполнение даже при ошибке.

### Готовые инструменты

~~~python
from contextlib import suppress, redirect_stdout, ExitStack

with suppress(FileNotFoundError):     # игнорировать ошибку
    os.remove("нет.txt")

with ExitStack() as stack:            # несколько ресурсов сразу
    f1 = stack.enter_context(open("a.txt"))
    f2 = stack.enter_context(open("b.txt"))
~~~

class Transaction:
    def __init__(self, log, name):
        self.log = log
        self.name = name

    def __enter__(self):
        self.log.append(f"{self.name}: start")
        return self

        if exc_type is None:
            self.log.append(f"{self.name}: end")
        else:
            self.log.append(f"{self.name}: error")
        return False

def tag(name):
    print(f"<{name}>")
    try:
        yield
    finally:
        print(f"</{name}>")

class LineReader:
    def __init__(self, path):
        self.path = path
        self._file = None

    def __enter__(self):
        self._file = open(self.path, encoding="utf-8")
        return self._file.read().splitlines()

    def __exit__(self, exc_type, exc_value, tb):
        if self._file:
            self._file.close()
        return False

    desc:`Большинство реальных программ обмениваются данными через **API** — чаще всего REST поверх HTTP с ответами в JSON.

### Основы HTTP

    desc:`### GIL — главное, что нужно знать

**Global Interpreter Lock** разрешает выполнять байт-код Python только одному потоку в момент времени. Отсюда простое правило:

- **I/O-bound** (сеть, диски, ожидание) → потоки или \`asyncio\`;
- **CPU-bound** (математика, обработка изображений) → \`multiprocessing\`.

### threading

~~~python
import threading

def worker(name):
    print("поток", name)

threads = [threading.Thread(target=worker, args=(i,)) for i in range(3)]
for t in threads:
    t.start()
for t in threads:
    t.join()
~~~

Для пула задач удобнее \`concurrent.futures\`:

~~~python
from concurrent.futures import ThreadPoolExecutor

with ThreadPoolExecutor(max_workers=4) as pool:
    results = list(pool.map(download, urls))
~~~

### multiprocessing

~~~python
from multiprocessing import Pool

with Pool(4) as p:
    results = p.map(heavy_task, data)
~~~

Отдельные процессы = отдельные интерпретаторы, GIL не мешает, но данные приходится передавать между процессами (это дороже).

### asyncio — конкурентность в одном потоке

~~~python
import asyncio

async def fetch(name):
    await asyncio.sleep(0.1)      # неблокирующее ожидание
    return f"данные {name}"

async def main():
    results = await asyncio.gather(*(fetch(n) for n in ["a", "b", "c"]))
    return results

asyncio.run(main())
~~~

Ключевые слова: \`async def\` — корутина, \`await\` — точка, где управление возвращается событийному циклу.

:::note
В песочнице PyCamp событийный цикл уже запущен средой выполнения, поэтому \`asyncio.run()\` здесь ответит ошибкой \`RuntimeError: asyncio.run() cannot be called from a running event loop\`, а \`asyncio.sleep\` и сетевые запросы не сработают. Это хороший повод посмотреть, как корутина устроена изнутри: её можно «прокрутить» вручную через \`coro.send(None)\` — именно так, только сложнее, работает любой событийный цикл.
:::

### Корутина без asyncio

~~~python
async def answer():
    return 42

coro = answer()          # объект-корутина, код ещё НЕ выполнен
try:
    coro.send(None)      # первый шаг: выполняется до первого await/return
except StopIteration as stop:
    print(stop.value)    # 42 — результат лежит в исключении
~~~

Если корутина ничего не ожидает (нет \`await\` на фьючерсах), одного шага достаточно, чтобы она завершилась.

### Что выбрать

| Задача | Инструмент |
|---|---|
| много сетевых запросов | \`asyncio\` или \`ThreadPoolExecutor\` |
| чтение/запись файлов | \`ThreadPoolExecutor\` |
| тяжёлые вычисления | \`multiprocessing\`, \`numpy\`, C-расширения |
| простой фоновый поток | \`threading.Thread\` |

### Сериализация dataclass в JSON

\`json.dumps\` не умеет объекты — нужен словарь:

~~~python
from dataclasses import asdict

def save(self, path):
    with open(path, "w", encoding="utf-8") as f:
        json.dump([asdict(t) for t in self.tasks], f, ensure_ascii=False, indent=2)

def load(self, path):
    try:
        with open(path, encoding="utf-8") as f:
            raw = json.load(f)
    except (FileNotFoundError, json.JSONDecodeError):
        return False
    self.tasks = [Task(**item) for item in raw]
    return True
~~~

\`Task(**item)\` — распаковка словаря в аргументы конструктора.

    solution:`import json
from dataclasses import dataclass, asdict

@dataclass
class Task:
    title: str
    priority: int = 1
    done: bool = False

class TodoApp:
    def __init__(self):
        self.tasks = []

    def add(self, title, priority=1):
        task = Task(title, priority)
        self.tasks.append(task)
        return task

    def complete(self, title):
        for task in self.tasks:
            if task.title == title and not task.done:
                task.done = True
                return True
        return False

    def remove(self, title):
        for i, task in enumerate(self.tasks):
            if task.title == title:
                self.tasks.pop(i)
                return True
        return False

    def pending(self):
        return [t for t in self.tasks if not t.done]

    def save(self, path):
        with open(path, "w", encoding="utf-8") as f:
            json.dump([asdict(t) for t in self.tasks], f, ensure_ascii=False, indent=2)

    def load(self, path):
        try:
            with open(path, encoding="utf-8") as f:
                raw = json.load(f)
        except (FileNotFoundError, json.JSONDecodeError):
            return False
        self.tasks = [Task(**item) for item in raw]
        return True

    def summary(self):
        return {
            "всего": len(self.tasks),
            "готово": sum(1 for t in self.tasks if t.done),
            "в работе": len(self.pending()),
        }

    hint:`Баланс храни в \`self._balance\` и открой через \`@property\`. История: \`self._history.append(f"+{amount}")\` / \`f"-{amount}"\`. Проценты: \`self.deposit(self.balance * self.rate / 100)\`.`,
    solution:`class InsufficientFunds(Exception):
    def __init__(self, balance, amount):
        super().__init__(f"Недостаточно средств: нужно {amount}, есть {balance}")
        self.balance = balance
        self.amount = amount

class Account:
    def __init__(self, owner, balance=0):
        self.owner = owner
        self._balance = balance
        self.history = []

    @property
    def balance(self):
        return self._balance

    def deposit(self, amount):
        if amount <= 0:
            raise ValueError("Сумма должна быть положительной")
        self._balance += amount
        self.history.append(f"+{amount}")

    def withdraw(self, amount):
        if amount <= 0:
            raise ValueError("Сумма должна быть положительной")
        if amount > self._balance:
            raise InsufficientFunds(self._balance, amount)
        self._balance -= amount
        self.history.append(f"-{amount}")

    def transfer(self, target, amount):
        self.withdraw(amount)
        try:
            target.deposit(amount)
        except Exception:
            self._balance += amount
            self.history.pop()
            raise

class SavingsAccount(Account):
    def __init__(self, owner, balance=0, rate=5):
        super().__init__(owner, balance)
        self.rate = rate

    def add_interest(self):
        amount = self.balance * self.rate / 100
        self.deposit(amount)
        return amount

class Bank:
    def __init__(self, name):
        self.name = name
        self.accounts = []

    def register(self, owner, balance=0):
        acc = Account(owner, balance)
        self.accounts.append(acc)
        return acc

    def get(self, owner):
        for acc in self.accounts:
            if acc.owner == owner:
                return acc
        return None

    def total_assets(self):
        return sum(acc.balance for acc in self.accounts)

a = bank.register("Анна", 1000)
b = bank.register("Иван", 500)
a.transfer(b, 200)

    solution:`LINES = [
    (0, 1, 2), (3, 4, 5), (6, 7, 8),
    (0, 3, 6), (1, 4, 7), (2, 5, 8),

class TicTacToe:
    def __init__(self):
        self.board = [""] * 9

    def move(self, pos, player):
        if not isinstance(pos, int) or isinstance(pos, bool):
            return False
        if not 0 <= pos <= 8:
            return False
        if player not in ("X", "O"):
            return False
        if self.board[pos]:
            return False
        if self.winner() is not None:
            return False
        self.board[pos] = player
        return True

    def winner(self):
        for a, b, c in LINES:
            cells = (self.board[a], self.board[b], self.board[c])
            if cells[0] and cells[0] == cells[1] == cells[2]:
                return cells[0]
        return None

    def available(self):
        return [i for i, cell in enumerate(self.board) if not cell]

    def is_draw(self):
        return not self.available() and self.winner() is None

    def render(self):
        rows = []
        for i in range(0, 9, 3):
            cells = [self.board[j] or str(j) for j in range(i, i + 3)]
            rows.append(" | ".join(cells))
            if i < 6:
                rows.append("-" * 9)
        return "\\n".join(rows)

game.move(0, "X")
game.move(4, "O")
game.move(1, "X")
game.move(5, "O")

### Формат CSV

~~~text
name,dept,salary
Анна,IT,120000
Иван,IT,110000
~~~

Первая строка — заголовки, остальные — данные. Разделитель может быть запятой, точкой с запятой или табуляцией.

### Встроенный модуль csv

~~~python
import csv

with open("people.csv", newline="", encoding="utf-8") as f:
    rows = list(csv.DictReader(f))       # список словарей

with open("out.csv", "w", newline="", encoding="utf-8") as f:
    writer = csv.DictWriter(f, fieldnames=["name", "dept"])
    writer.writeheader()
    writer.writerows(rows)
~~~

### Ручной парсинг (полезно для строк из API)

~~~python
def parse_csv(text):
    lines = [ln for ln in text.strip().splitlines() if ln.strip()]
    header = lines[0].split(",")
    return [dict(zip(header, ln.split(","))) for ln in lines[1:]]
~~~

    hint:`\`group_sum\`: \`totals[row[group_key]] = totals.get(...) + float(row[value_key])\`; если все суммы целые, возвращай \`int\`. Отчёт по отделам: \`sorted(totals.items())\`.`,
    solution:`def parse_csv(text):
    lines = [ln for ln in text.strip().splitlines() if ln.strip()]
    if not lines:
        return []
    header = [h.strip() for h in lines[0].split(",")]
    rows = []
    for line in lines[1:]:
        values = [v.strip() for v in line.split(",")]
        rows.append(dict(zip(header, values)))
    return rows

def to_csv(rows):
    if not rows:
        return ""
    header = list(rows[0].keys())
    lines = [",".join(header)]
    for row in rows:
        lines.append(",".join(str(row.get(col, "")) for col in header))
    return "\\n".join(lines)

def filter_rows(rows, key, value):
    return [row for row in rows if row.get(key) == value]

def group_sum(rows, group_key, value_key):
    totals = {}
    for row in rows:
        group = row[group_key]
        totals[group] = totals.get(group, 0) + int(row[value_key])

### Почему не просто eval()

\`eval("__import__('os').system('rm -rf /')")\` выполнит что угодно. \`eval\` допустим только при жёсткой фильтрации входа.

~~~python
import re

ALLOWED = re.compile(r"^[0-9+\\-*/(). ]+$")

def safe_eval(expr):
    if not ALLOWED.fullmatch(expr) or "**" in expr:
        raise ValueError("Недопустимые символы")
    try:
        return eval(expr, {"__builtins__": {}}, {})
    except ZeroDivisionError:
        raise ValueError("Деление на ноль")
    except SyntaxError:
        raise ValueError("Некорректное выражение")
~~~

Пустой \`__builtins__\` отрезает доступ к \`import\`, \`open\` и прочим опасным функциям.
